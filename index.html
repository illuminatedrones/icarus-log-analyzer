// ═══════════════════════════════════════
//  STATE & UI
// ═══════════════════════════════════════
let drones=[],cur=0,cmpMode=false,cmpA=0,cmpB=1;
let customCharts={};

const MSG_DESCS={
  BAT:`Battery telemetry — voltage and current draw, logged about 10 times per second.
<b>Key fields:</b> <em>Volt</em> (pack voltage), <em>Curr</em> (current in amps, positive = discharging), <em>CurrTot</em> (mAh consumed since boot), <em>Temp</em> (battery temperature if monitored).
<b>What to look for:</b> Volt dropping while Curr spikes is voltage sag from weak cells or hard pulls. Volt below 3.35V/cell at the end means over-discharge. A sudden Volt drop to zero with no landing = battery ejection or wiring failure.`,

  CURR:`Older ArduPilot battery message — same data as BAT, used on legacy firmwares.`,

  GPS:`GPS receiver fix — logged about 5 times per second per GPS instance.
<b>Key fields:</b> <em>Status</em> (0 = no GPS, 1 = no fix, 2 = 2D, 3 = 3D, 4 = DGPS, 5 = RTK Float, 6 = RTK Fixed), <em>NSats</em> (visible satellites — 8+ ideal), <em>Lat</em>/<em>Lng</em>/<em>Alt</em> (position in degrees and metres), <em>Spd</em> (ground speed m/s), <em>HDop</em> (geometric dilution — lower is better).
<b>What to look for:</b> For a light show you want Status = 6 (RTK Fixed) for the entire flight. Anything below 6 means the drone is using less precise positioning and may visibly leave its commanded pixel. Status dropping to 0–2 means the drone is flying on dead-reckoning and its position estimate will drift.`,

  GPA:`GPS accuracy estimate — paired with each GPS message.
<b>Key fields:</b> <em>HAcc</em> (horizontal accuracy in metres — target &lt;0.5m), <em>VAcc</em> (vertical accuracy), <em>SAcc</em> (speed accuracy), <em>HDop</em>/<em>VDop</em> (dilution of precision).
<b>What to look for:</b> HAcc spikes usually mean multipath — signal reflections from buildings, water, or nearby drones. Persistent HAcc &gt;1m means the show site has poor GPS conditions; try a different launch position or check antenna mounting.`,

  ATT:`Vehicle attitude in degrees — what the drone is doing vs what the autopilot wants it to do.
<b>Key fields:</b> <em>Roll</em>/<em>Pitch</em>/<em>Yaw</em> (current orientation), <em>DesRoll</em>/<em>DesPitch</em>/<em>DesYaw</em> (commanded orientation).
<b>What to look for:</b> Big gaps between actual and desired = the attitude controller can't keep up (wind, weight, PID tuning). Yaw drifting while DesYaw is stable = unintentional spinning, often a prop strike or yaw-PID issue.`,

  BARO:`Barometer — atmospheric pressure converted to altitude.
<b>Key fields:</b> <em>Alt</em> (absolute altitude in metres above the launch reference), <em>RelAlt</em> (relative altitude / AGL), <em>Press</em> (pressure in Pa), <em>Temp</em> (sensor temperature), <em>CRt</em> (climb rate m/s, computed by the autopilot).
<b>What to look for:</b> BARO is the primary source for altitude hold. Temperature spikes can cause altitude drift. RelAlt is the most useful field for "how high is the drone right now".`,

  IMU:`Inertial measurement unit — raw accelerometers and gyros from one IMU instance.
<b>Key fields:</b> <em>AccX</em>/<em>Y</em>/<em>Z</em> (acceleration m/s²), <em>GyrX</em>/<em>Y</em>/<em>Z</em> (rotation rate rad/s), <em>T</em> (sensor temperature °C).
<b>What to look for:</b> T rising above 60°C means inadequate cooling. Most copters have multiple IMUs; if one diverges the EKF will switch lanes (see NKF5).`,

  VIBE:`Vibration on each IMU axis — one of the most predictive crash signals.
<b>Key fields:</b> <em>VibeX</em>, <em>VibeY</em>, <em>VibeZ</em> (vibration magnitude in m/s², target &lt;30, critical &gt;60), <em>Clip0</em>/<em>1</em>/<em>2</em> (cumulative count of times the accelerometer saturated).
<b>What to look for:</b> VibeZ above 30 = inspect props (nicks, cracks), motor balance, FC vibration dampening. Above 60 will degrade the EKF position estimate. Any clip count &gt;0 means the IMU was hit so hard the sensor saturated; position estimates were unreliable while clipping was active.`,

  NKF1:`Extended Kalman Filter primary navigation state — the autopilot's best estimate of where it is.
<b>Key fields:</b> <em>Roll</em>/<em>Pitch</em>/<em>Yaw</em> (filtered attitude), <em>VN</em>/<em>VE</em>/<em>VD</em> (velocity North/East/Down), <em>PN</em>/<em>PE</em>/<em>PD</em> (position N/E/D from origin), <em>GX</em>/<em>GY</em>/<em>GZ</em> (gyro bias estimates).
<b>What to look for:</b> This is the "ground truth" the autopilot acts on. Compare PN/PE to GPS Lat/Lng to spot navigation drift.`,

  NKF2:`EKF wind / magnetic-field / accel-bias estimates.
<b>Key fields:</b> <em>VWN</em>, <em>VWE</em> (wind velocity North/East m/s — what the autopilot thinks the wind is), <em>MN</em>/<em>ME</em>/<em>MD</em> (earth magnetic-field components), <em>MX</em>/<em>MY</em>/<em>MZ</em> (body-frame magnetic field).
<b>What to look for:</b> Wind magnitude = sqrt(VWN² + VWE²). For light shows, sustained wind &gt;8 m/s means visible formation drift. Magnetic-field components changing with motor RPM = current-induced compass interference.`,

  NKF4:`EKF innovation variance ratios — how confident the filter is in each sensor.
<b>Key fields:</b> <em>SV</em> (velocity innovation ratio), <em>SP</em> (position), <em>SH</em> (height), <em>SM</em> (magnetometer), <em>SVT</em> (vibration affecting filter), <em>TI</em> (terrain).
<b>What to look for:</b> Each ratio should be &lt;0.5. Above 1.0 means the filter rejected its own sensor — it doesn't believe what it's reading. This often precedes "EKF Failsafe" RTL/Land. SV&gt;1 implies GPS issue; SM&gt;1 implies compass issue.`,

  NKF5:`EKF lane / quaternion / sensor health.
<b>Key fields:</b> <em>NI</em> (active EKF lane index 0/1/2 for triple-IMU systems), error counters, accel bias.
<b>What to look for:</b> NI changing means the EKF switched to a backup IMU lane — usually because the primary IMU showed bad data. Multiple lane switches = serious sensor health problem.`,

  XKF1:`Same as NKF1 but for the alternate (secondary) EKF lane.`,
  XKF2:`Same as NKF2 but for the alternate EKF lane.`,
  XKF4:`Same as NKF4 but for the alternate EKF lane.`,
  EKF1:`Older single-lane EKF state output — use NKF1 if your firmware also logs it.`,

  MAG:`Compass / magnetometer raw readings.
<b>Key fields:</b> <em>MagX</em>, <em>MagY</em>, <em>MagZ</em> (magnetic field in milligauss, body frame), <em>OfsX</em>/<em>Y</em>/<em>Z</em> (calibration offsets), <em>MOfsX</em>/<em>Y</em>/<em>Z</em> (motor compensation).
<b>What to look for:</b> Vector magnitude sqrt(MagX² + MagY² + MagZ²) should be roughly constant and match Earth's local field (~250–650 mGauss). Big swings during motor activity = motor/ESC current bleeding into the compass — yaw estimate will drift under load.`,

  MODE:`Flight-mode transition — one row each time the mode changes.
<b>Key fields:</b> <em>Mode</em>/<em>ModeNum</em> (numeric mode), <em>Rsn</em> (reason code).
<b>What to look for:</b> Unexpected mode changes (Auto → RTL or Auto → Land) usually mean the autopilot triggered a failsafe — check ERR and EV at the same timestamp.`,

  ERR:`Subsystem error — fault flagged by a specific subsystem.
<b>Key fields:</b> <em>Subsys</em> (1=Main, 2=Radio, 3=Compass, 4=OptFlow, 5=FS Radio, 6=FS Battery, 7=FS GPS, 8=FS GCS, 9=FS Fence, 10=Flight Mode, 11=GPS, 12=Crash, 16=EKF, 17=FS EKF, 22=Throttle, 23=EKF Primary), <em>ECode</em> (0 = cleared/recovered, non-zero = active fault).
<b>What to look for:</b> Any non-zero ECode is a real problem — read the subsystem to know what failed. ECode = 0 means "back to normal" and is informational.`,

  EV:`Autopilot event — discrete state changes (armed, disarmed, takeoff, land, failsafe, crash check, parachute).
<b>Key fields:</b> <em>Id</em> (event ID — see analyzer for translation).
<b>What to look for:</b> id 15 (Crash Check), 17 (EKF Failsafe), 25 (Throttle Failsafe), 45 (Parachute), 54 (Auto Disarmed in flight) are show-killers. Other IDs (Armed, Disarmed, Land Complete) are normal lifecycle events.`,

  MSG:`Free-form text status messages from the autopilot — startup banner, PreArm checks, EKF events, crash detection, mode-change reasons.
<b>Key fields:</b> <em>Message</em> (the human-readable text).
<b>What to look for:</b> This is the autopilot talking to you in plain English. "PreArm: ..." messages explain why the drone won't arm. "EKF Variance" / "EKF lane switch" indicate sensor-fusion instability. "Crash: ..." or "Land Complete" tell you exactly how the flight ended.`,

  RCOU:`RC output PWM — what the autopilot is commanding to each motor/ESC.
<b>Key fields:</b> <em>C1</em>–<em>C8</em> (PWM in microseconds, 1000 = min throttle, 2000 = max).
<b>What to look for:</b> For a quad, C1–C4 are the four lift motors. Spread &gt;400 µs between them = motor imbalance (one motor working harder, often from prop damage or motor weakness). All four sustained at ≥1900 = motor saturation, drone can't climb any more — headed for fall-out.`,
  RCOUT:`Same as RCOU on older firmwares.`,

  RCIN:`RC input — what the receiver is reporting from the transmitter.
<b>Key fields:</b> <em>C1</em>–<em>C16</em> (channel PWM values).
<b>What to look for:</b> Channels going static or jumping to specific failsafe values means lost link with the transmitter. For autonomous shows the radio link is usually a backup safety channel only.`,

  RADIO:`SiK telemetry-radio link statistics.
<b>Key fields:</b> <em>rssi</em>/<em>remrssi</em> (signal strength local/remote), <em>txbuf</em>, <em>noise</em>/<em>remnoise</em>, <em>rxerrors</em> (cumulative receive errors), <em>fixed</em>.
<b>What to look for:</b> rssi typically 100–200. rxerrors should stay low. A rapidly rising rxerrors counter means link is being saturated or jammed.`,

  CTUN:`Control tuning — throttle in/out and altitude control loop.
<b>Key fields:</b> <em>ThI</em> (throttle input 0–1), <em>ThO</em> (throttle output to motors), <em>DAlt</em> (desired altitude), <em>Alt</em> (actual altitude), <em>DCRt</em> (desired climb rate), <em>CRt</em> (actual climb rate).
<b>What to look for:</b> ThO sustained near 1.0 = motor saturation (overweight, weak motors, low battery). DAlt vs Alt gap = altitude hold struggling.`,

  NTUN:`Navigation tuning — lateral position-control loop.
<b>Key fields:</b> <em>WPDst</em> (distance to waypoint), <em>DesYaw</em>/<em>Yaw</em>, <em>DPosX</em>/<em>Y</em> (desired position), <em>PosX</em>/<em>Y</em> (actual), <em>DVelX</em>/<em>Y</em> (desired velocity), <em>VelX</em>/<em>Y</em> (actual).
<b>What to look for:</b> Big DPos vs Pos gaps = position controller can't reach the commanded point. Often caused by wind, EKF drift, or commanded velocity exceeding configured limits.`,

  PSCN:`Position controller, North axis — commanded vs actual North position.
<b>Key fields:</b> <em>TPN</em> (target North position m), <em>PN</em> (actual North m), <em>TVN</em>/<em>VN</em> (target/actual velocity), <em>TAN</em>/<em>AN</em> (target/actual acceleration).
<b>What to look for:</b> |TPN − PN| is the live tracking error in metres on the N axis. For light shows anything &gt;0.5m is visible to viewers.`,
  PSCE:`Position controller, East axis — same fields as PSCN but for the East axis.`,
  PSCD:`Position controller, Down axis — same fields as PSCN but for vertical (D = down, so positive = below origin).`,

  PIDR:`Roll-axis PID controller output — desired vs actual rate plus per-term contributions.
<b>Key fields:</b> <em>Tar</em> (target rate), <em>Act</em> (actual), <em>P</em>/<em>I</em>/<em>D</em>/<em>FF</em> (per-term outputs), <em>Out</em> (combined).
<b>What to look for:</b> Persistent gap between Tar and Act = poor PID tune or saturated motors.`,
  PIDP:`Pitch-axis PID — same fields as PIDR.`,
  PIDY:`Yaw-axis PID — same fields as PIDR. Sustained gap between Tar and Act on yaw + the drone visibly spinning = yaw controller can't hold heading (collision, prop strike, motor torque imbalance).`,

  PM:`Performance monitor — flight-controller scheduler health, logged about once per 10s.
<b>Key fields:</b> <em>NLon</em> (slow-loop count since last PM), <em>MaxT</em> (peak loop time µs), <em>Mem</em> (free RAM bytes), <em>Load</em> (CPU %), <em>LogDrop</em> (cumulative log records lost).
<b>What to look for:</b> MaxT &gt;2500 µs at 400 Hz = scheduler missed deadlines. LogDrop &gt;0 = SD card too slow, expect gaps in this log. Mem trending toward zero = memory leak.`,

  ESC:`ESC telemetry per motor — only present on ESCs with telemetry feedback.
<b>Key fields:</b> <em>RPM</em>, <em>Volt</em>, <em>Curr</em>, <em>Temp</em> (per motor).
<b>What to look for:</b> One motor at notably lower RPM than its peers = weak motor or prop damage. Temp &gt;80°C = ESC overheating.`,

  STAT:`System status flags.
<b>Key fields:</b> <em>Arm</em> (armed state 0/1), <em>IsCrashed</em> (crash detection bit), <em>LandComplete</em>, <em>Safety</em>.
<b>What to look for:</b> IsCrashed = 1 means the autopilot's crash detector fired.`,

  CMD:`Mission commands executed — each row is one waypoint or command from the loaded mission.`,

  PARM:`Parameter changes recorded during the flight — usually the full parameter dump at boot.`,

  MAVC:`MAVLink channel statistics — packet counts and drops on the GCS link.`,

  SHOW:`Swarm light-show coordination message — position/colour commands from the show software.
<b>What to look for:</b> Gaps between SHOW messages = lost choreography commands. The drone falls back to its last-known target until the next message arrives.`,

  GUIA:`Formation guidance position commands from the show software (alternate name).`,

  SIDS:`Swarm ID and time-sync messages — used by the show software to keep all drones on the same clock.`,

  AETR:`Attitude error and throttle response — diagnostic for tuning.`,
};

// ── Chart Registry ──
const CHART_REGISTRY={
  gpsStat:{title:'GPS Fix Status',  color:'#FA9C21',type:'step',key:'gpsStat'},
  sats:   {title:'Satellite Count', color:'#22c55e',type:'line',key:'sats',yMin:0,yFmt:v=>v.toFixed(0)},
  volt:   {title:'Battery Voltage', color:'#FA9C21',type:'line',key:'volt',yFmt:v=>`${v.toFixed(2)}V`,label:'V'},
  curr:   {title:'Current Draw',    color:'#a855f7',type:'line',key:'curr',yMin:0,yFmt:v=>`${v.toFixed(1)}A`,label:'A'},
  agl:    {title:'AGL (m)',         color:'#06b6d4',type:'line',key:'agl',yFmt:v=>`${v.toFixed(1)}m`,label:'m'},
  temp:   {title:'Temperature (°C)',color:'#f97316',type:'line',key:'temp',yFmt:v=>`${v.toFixed(1)}°C`},
  spd:    {title:'H. Speed (m/s)', color:'#06b6d4',type:'line',key:'spd',yMin:0,yFmt:v=>`${v.toFixed(1)}m/s`},
  vspd:   {title:'V. Speed (m/s)', color:'#06b6d4',type:'line',key:'vspd',yFmt:v=>`${v.toFixed(1)}m/s`},
  yaw:    {title:'Yaw (°)',         color:'#3b82f6',type:'line',key:'yaw',yFmt:v=>`${v.toFixed(1)}°`},
  pitch:  {title:'Pitch (°)',       color:'#a855f7',type:'line',key:'pitch',yFmt:v=>`${v.toFixed(1)}°`},
  roll:   {title:'Roll (°)',        color:'#22c55e',type:'line',key:'roll',yFmt:v=>`${v.toFixed(1)}°`},
  hacc:   {title:'GPS H. Accuracy',color:'#f97316',type:'line',key:'hacc',yMin:0,yFmt:v=>`${v.toFixed(2)}m`,thresholds:[{value:.5,color:'#22c55e'},{value:2,color:'#ef4444'}]},
  rssi:   {title:'SiK RSSI',        color:'#FA9C21',type:'line',key:'rssi',yMin:0,yFmt:v=>v.toFixed(0)},
  vibe:   {title:'Vibration Z (m/s²)',color:'#ef4444',type:'line',key:'vibe',yMin:0,yFmt:v=>v.toFixed(1),thresholds:[{value:30,color:'#f97316'},{value:60,color:'#ef4444'}]},
  ekfVar: {title:'EKF Variance Ratio',color:'#a855f7',type:'line',key:'ekfVar',yMin:0,yFmt:v=>v.toFixed(2),thresholds:[{value:.5,color:'#f97316'},{value:1,color:'#ef4444'}]},
  mag:    {title:'Compass Field (mGauss)',color:'#06b6d4',type:'line',key:'mag',yMin:0,yFmt:v=>v.toFixed(0)},
  wind:   {title:'Wind Estimate (m/s)',color:'#22c55e',type:'line',key:'wind',yMin:0,yFmt:v=>`${v.toFixed(1)}m/s`},
};
const DEFAULT_PINS=['gpsStat','sats','volt','curr','agl','vibe','ekfVar','temp','spd','vspd','yaw','pitch','roll','hacc','rssi'];
const LS_PINS='icarus-pinned-v1';

function getPinned(){
  try{const s=localStorage.getItem(LS_PINS);if(s)return JSON.parse(s);}catch(e){}
  return DEFAULT_PINS.map(k=>({src:'builtin',key:k}));
}
function savePinned(pins){try{localStorage.setItem(LS_PINS,JSON.stringify(pins));}catch(e){}}

// ── Undo infrastructure ──
let _lastRemovedPin=null,_lastRemovedIdx=0,_undoTimer=null;

function removePin(idx){
  const pins=getPinned();
  _lastRemovedPin={...pins[idx]};_lastRemovedIdx=idx;
  pins.splice(idx,1);savePinned(pins);
  rerenderTopCharts(drones[cur]);
  showUndoToast('Chart removed','undoRemovePin');
}
function undoRemovePin(){
  if(!_lastRemovedPin)return;
  const pins=getPinned();
  pins.splice(Math.min(_lastRemovedIdx,pins.length),0,_lastRemovedPin);
  savePinned(pins);_lastRemovedPin=null;
  rerenderTopCharts(drones[cur]);
  hideToast();
}
function resetPins(){
  savePinned(DEFAULT_PINS.map(k=>({src:'builtin',key:k})));
  rerenderTopCharts(drones[cur]);showToast('Charts reset to defaults');
}
function addCustomPin(di,type,field){
  const pins=getPinned();
  if(pins.some(p=>p.src==='custom'&&p.type===type&&p.field===field)){showToast('Already pinned');return;}
  pins.push({src:'custom',type,field,title:`${type} · ${field}`});
  savePinned(pins);rerenderTopCharts(drones[di]);showToast(`Pinned: ${type} · ${field}`);
}

function rerenderTopCharts(d){
  const cont=document.getElementById('main-charts');if(!cont||!d)return;
  const pins=getPinned();const dur=d.stats.durSecs||0;
  const active=pins.filter(p=>{
    if(p.src==='builtin'){const cr=CHART_REGISTRY[p.key];return cr&&(d.charts[cr.key]||[]).length>0;}
    return true;
  });
  if(!active.length){
    cont.innerHTML='<div style="grid-column:1/-1;padding:30px;text-align:center;color:var(--dimmer);font-size:14px">No charts pinned — chart a field in the Message Explorer, then click <strong style="color:var(--accent)">⊕ Pin to top</strong>, or <button onclick="resetPins()" class="trange-reset" style="margin-left:8px">↺ Reset to defaults</button></div>';
    return;
  }
  cont.innerHTML=active.map((p,i)=>{
    const cr=p.src==='builtin'?CHART_REGISTRY[p.key]:null;
    const title=cr?cr.title:p.title;const color=cr?cr.color:'#FA9C21';
    const cid=p.src==='builtin'?`pin-${p.key}`:`pin-c-${p.type}-${p.field}`;
    return`<div class="cc"><div class="cct"><span class="ccdot" style="background:${color}"></span>${title}<button class="pin-rm" onclick="removePin(${i})" title="Remove from top">−</button></div><div class="cw" id="${cid}"></div></div>`;
  }).join('');
  requestAnimationFrame(()=>{
    active.forEach((p)=>{
      const cr=p.src==='builtin'?CHART_REGISTRY[p.key]:null;
      const cid=p.src==='builtin'?`pin-${p.key}`:`pin-c-${p.type}-${p.field}`;
      const el=document.getElementById(cid);if(!el)return;
      if(p.src==='builtin'&&cr){
        if(cr.type==='step')stepChart(el,d.charts[cr.key],null,dur);
        else{
          const th=cr.key==='volt'?[{value:d.stats.warnV,color:'#f97316'},{value:d.stats.critV,color:'#ef4444'}]:(cr.thresholds||[]);
          lineChart(el,d.charts[cr.key],{color:cr.color,yMin:cr.yMin,thresholds:th,yFmt:cr.yFmt,label:cr.label||''},null,'#3b82f6',dur);
        }
      } else if(p.src==='custom'){
        const raw=(d.rawMsgs[p.type]||[]).filter(m=>m[p.field]!=null&&typeof m[p.field]==='number');
        if(!raw.length){el.innerHTML='<div class="no-data">No data</div>';return;}
        const tMin=d.stats.tMin;
        let pts=raw.map(m=>({x:((m.TimeUS||tMin)-tMin)/1e6,y:m[p.field]}));
        if(pts.length>600){const st=Math.floor(pts.length/500);pts=pts.filter((_,j)=>j%st===0);}
        lineChart(el,pts,{color:'#FA9C21'},null,'#3b82f6',dur);
      }
    });
  });
}

function rerenderCharts(d){
  rerenderTopCharts(d);
  restoreExpCharts(cur);
}

// ── Toast & Undo ──
function showToast(msg){
  if(_undoTimer){clearTimeout(_undoTimer);_undoTimer=null;}
  const t=document.getElementById('toast');
  t.innerHTML=`<span>${msg}</span>`;
  t.classList.add('show');
  _undoTimer=setTimeout(()=>t.classList.remove('show'),3000);
}
function showUndoToast(msg,undoFn){
  if(_undoTimer){clearTimeout(_undoTimer);_undoTimer=null;}
  const t=document.getElementById('toast');
  t.innerHTML=`<span>${msg}</span><button class="toast-undo" onclick="${undoFn}()">Undo</button>`;
  t.classList.add('show');
  _undoTimer=setTimeout(()=>{t.classList.remove('show');_lastRemovedPin=null;},5000);
}
function hideToast(){
  if(_undoTimer){clearTimeout(_undoTimer);_undoTimer=null;}
  document.getElementById('toast').classList.remove('show');
  _lastRemovedPin=null;
}

function toggleCmp(){cmpMode=!cmpMode;document.getElementById('cmpbtn').classList.toggle('on',cmpMode);renderDrone(cur);}

function rebuildTabs(){
  document.getElementById('tabs').innerHTML=drones.map((d,i)=>`<button class="tab${i===cur?' active':''}" onclick="renderDrone(${i})">${d.droneId}</button>`).join('');
  document.getElementById('addbtn').style.display=drones.length?'':'none';
  document.getElementById('cmpbtn').style.display=drones.length>1?'':'none';
}

function updateTR(){
  let s=+document.getElementById('trs').value,e=+document.getElementById('tre').value;
  if(s>=e){s=Math.max(0,e-1);document.getElementById('trs').value=s;}
  TR={s:s/100,e:e/100};
  const d=drones[cur];if(!d)return;
  const dur=d.stats.durSecs||0;
  const t0=(TR.s*dur).toFixed(1),t1=(TR.e*dur).toFixed(1);
  document.getElementById('trdisp').textContent=TR.s===0&&TR.e===1?'Full flight':`T+${t0}s — T+${t1}s`;
  const fill=document.getElementById('trfill');
  fill.style.left=`${TR.s*100}%`;fill.style.width=`${(TR.e-TR.s)*100}%`;
  if(cmpMode)renderCompare();else rerenderCharts(d);
}

function resetTR(){
  document.getElementById('trs').value=0;document.getElementById('tre').value=100;
  TR={s:0,e:1};document.getElementById('trdisp').textContent='Full flight';
  document.getElementById('trfill').style.cssText='left:0%;width:100%;';
  if(cmpMode)renderCompare();else rerenderCharts(drones[cur]);
}

function _resetSliderUI(){
  const trs=document.getElementById('trs'),tre=document.getElementById('tre');
  if(trs)trs.value=0;if(tre)tre.value=100;
  const trdisp=document.getElementById('trdisp');
  if(trdisp)trdisp.textContent='Full flight';
  const trfill=document.getElementById('trfill');
  if(trfill)trfill.style.cssText='left:0%;width:100%;';
}

function renderDrone(idx){
  cur=idx;
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i===idx));
  if(cmpMode){renderCompare();return;}
  TR={s:0,e:1};_resetSliderUI();
  const d=drones[idx],dc=document.getElementById('di');

  function si(lbl,val,unit,tip,cls){
    return '<div class="si'+(cls?' '+cls:'')+'" data-tip="'+tip+'">'
      +'<div class="sil">'+lbl+'</div>'
      +'<div class="siv">'+val+(unit?'<span class="siu"> '+unit+'</span>':'')+'</div>'
      +'</div>';
  }

  const nCrit=d.findings.filter(f=>f.sev==='crit').length;
  const nWarn=d.findings.filter(f=>f.sev==='warn').length;
  const warnVal=nCrit?`${nCrit} crit${nWarn?', '+nWarn+' warn':''}`:nWarn?`${nWarn} warn`:'None';
  const warnColor=nCrit?'var(--red)':nWarn?'var(--accent)':'var(--green)';

  const statsHtml=
    si('Drone ID',d.droneId,'','Filename-derived drone identifier. Format is typically [show]-[drone] e.g. 6-031.','si-id')
    +si('Duration',d.stats.duration,'','Total flight log duration from first to last recorded message.')
    +(d.stats.minGpsFixStr?si('GPS Fix',d.stats.minGpsFixStr,'','Worst GPS fix quality during the flight. RTK Fixed (6) is best.'):'')
    +(d.stats.avgSats?si('Satellites',d.stats.avgSats+' avg','','Satellite count: avg '+d.stats.avgSats+', min '+(d.stats.minSats||'?')+'. Below 8 is marginal for RTK.'):'')
    +(d.stats.minV!=null?si('Battery V',d.stats.minV.toFixed(2),'V','Minimum pack voltage recorded.'):'')
    +(d.stats.maxCurr?si('Batt Draw',d.stats.maxCurr,'','Peak current draw from the battery.'):'')
    +(d.stats.maxAGL?si('Max AGL',d.stats.maxAGL,'','Maximum altitude above ground level from barometric sensor.'):'')
    +(d.stats.maxTemp?si('Max Temp',d.stats.maxTemp,'','Peak temperature from IMU or barometer sensor.'):'')
    +(d.stats.maxSpd?si('H. Speed',d.stats.maxSpd,'','Maximum horizontal ground speed recorded by GPS.'):'')
    +(d.stats.maxVSpd?si('V. Speed',d.stats.maxVSpd,'','Maximum vertical speed derived from altitude data.'):'')
    +(d.stats.maxPitch?si('Peak Pitch',d.stats.maxPitch,'','Maximum absolute pitch angle.'):'')
    +(d.stats.maxRoll?si('Peak Roll',d.stats.maxRoll,'','Maximum absolute roll angle.'):'')
    +(d.stats.maxVib?si('Vibration',d.stats.maxVib,'','Peak vibration on any IMU axis. Target <30 m/s², critical >60.'):'')
    +(d.stats.ekfMaxV?si('EKF Var',d.stats.ekfMaxV,'','Peak EKF innovation variance ratio. Target <0.5; >1.0 means the filter rejected its own sensors.'):'')
    +(d.stats.maxWind?si('Wind',d.stats.maxWind,'','Peak wind speed estimated by the EKF (NKF2 VWN/VWE).'):'')
    +(d.stats.maxPosErr?si('Pos Err',d.stats.maxPosErr,'','Maximum position-controller tracking error (commanded vs actual position).'):'')
    +(d.stats.peakLoop?si('Loop Peak',d.stats.peakLoop,'','Peak autopilot scheduler loop time. Target <2500µs at 400Hz.'):'')
    +'<div class="si" data-tip="Total warnings and critical issues detected across all checks.">'
      +'<div class="sil">Warnings</div>'
      +'<div class="siv" style="color:'+warnColor+'">'+warnVal+'</div>'
    +'</div>';

  const msgTypesHtml=Object.entries(d.msgTypes).sort((a,b)=>b[1].count-a[1].count).map(([nm,info])=>{
    const desc=MSG_DESCS[nm]||'Raw telemetry message type recorded by the autopilot';
    const fields=info.num.map(f=>
      `<span class="ecf" id="ef-${idx}-${nm}-${f}" onclick="toggleExpChart(${idx},'${nm}','${f}')">${f}</span>`
    ).join('');
    return`<div class="ecard" id="ec-${nm}"><div class="ecard-desc">${desc}</div><div class="ecn">${nm}</div><div class="ecc">${info.count.toLocaleString()} messages</div><div class="ecfs">${fields||'<span style="color:var(--dimmer);font-size:11px">no numeric fields</span>'}</div></div>`;
  }).join('');

  dc.innerHTML=`
  <div class="sbar">${statsHtml}</div>

  <div class="cgrid">${d.cards.map(c=>`
    <div class="acard ${c.status}">
      <div class="acard-tip">${c.tip||''}</div>
      <div class="acl">${c.label}</div>
      <div class="acv">${c.val}</div>
      <div class="acd">${c.desc}</div>
    </div>`).join('')}
  </div>

  <div class="shd">Primary Issues</div>
  <div class="findings">${(()=>{
    // Verdict + non-cascade critical findings only
    const top=d.findings.filter(f=>(f.sev==='crit'&&!f._cascade)||f._verdict);
    return top.length?top.map(f=>`<div class="finding ${f.sev}"><span class="fi">${f.icon}</span><span class="ft">${f.text}</span></div>`).join('')
      :`<div class="finding ok"><span class="fi">✅</span><span class="ft"><strong>No critical issues detected</strong></span></div>`;
  })()}</div>
  ${(()=>{
    // Other Notes = cascade crits (likely impact-cascade noise) + warn-level findings
    const cascade=d.findings.filter(f=>f.sev==='crit'&&f._cascade&&!f._verdict);
    const warn=d.findings.filter(f=>f.sev==='warn'&&!f._verdict);
    const other=[...cascade,...warn];
    if(!other.length)return'';
    const cascadeNote=cascade.length?'<div style="font-size:11px;color:var(--dim);margin:-4px 0 6px;font-style:italic">Items below the line likely fired as a downstream consequence of the primary issue above.</div>':'';
    return`<div class="shd" style="margin-top:14px">Other Notes</div>${cascadeNote}<div class="findings">${other.map(f=>`<div class="finding ${f.sev}${f._cascade?' cascade':''}"><span class="fi">${f.icon}</span><span class="ft">${f.text}</span></div>`).join('')}</div>`;
  })()}

  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;">
    <div class="shd" style="margin:0">Telemetry</div>
    <button class="trange-reset" onclick="resetPins()">↺ Reset Charts</button>
  </div>
  <div class="cgrd" id="main-charts"></div>

  <div class="shd">Event Log</div>
  ${d.events.length?`<div class="evt"><table>
    <thead><tr><th>Time</th><th>Event</th><th>Severity</th><th>Details</th></tr></thead>
    <tbody>${d.events.map(e=>`<tr>
      <td style="font-family:monospace;color:var(--accent);font-size:12px">T+${e.t}s</td>
      <td style="font-weight:600;font-size:13px">${e.type}</td>
      <td>${e.sev==='crit'?'<span class="bdg bct">CRIT</span>':e.sev==='warn'?'<span class="bdg bwn">WARN</span>':'<span class="bdg bin">INFO</span>'}</td>
      <td style="color:#bbb;font-size:13px">${e.detail}</td></tr>`).join('')}
    </tbody></table></div>`
  :`<div class="evt" style="padding:20px;text-align:center;color:var(--dimmer);font-size:13px">No notable events logged</div>`}

  <div class="shd">Message Explorer</div>
  <div class="explorer-panel">
    <div class="exp-hdr">
      <div style="display:flex;align-items:center;gap:9px;">
        <span class="exp-title">📋 All Logged Types</span>
        <span class="exp-count">${Object.keys(d.msgTypes).length} types · ${Object.values(d.msgTypes).reduce((s,t)=>s+t.count,0).toLocaleString()} messages</span>
      </div>
      <div class="exp-search-wrap">
        <input type="text" id="exp-search" placeholder="Search — e.g. battery, RTK, vibration" oninput="filterExplorer(this.value,${idx})">
      </div>
    </div>
    <div class="exp-body">
      <div class="exp-list" id="expg">${msgTypesHtml||'<div class="exp-empty">No message types parsed from this log.<br>The file may be too short (failed pre-arm), corrupted, or not an ArduPilot binary log.</div>'}</div>
      <div class="exp-charts" id="excg"><div class="exp-placeholder"><p>Click any field on the left to chart it.</p><p>Then hit <strong>⊕ Pin to top</strong> on the chart to add it to the Telemetry section above.</p></div></div>
    </div>
  </div>
  `;

  requestAnimationFrame(()=>rerenderCharts(d));
}

// ── Compare ──
function renderCompare(){
  const dc=document.getElementById('di');
  const dA=drones[cmpA],dB=drones[cmpB];
  if(!dA||!dB){dc.innerHTML='<div style="padding:40px;text-align:center;color:var(--dim)">Select two drones to compare.</div>';return;}
  if(cmpA===cmpB){dc.innerHTML='<div style="padding:40px;text-align:center;color:var(--dim)">Select different drones to compare.</div>';return;}
  const dur=Math.max(dA.stats.durSecs||0,dB.stats.durSecs||0);
  function mrow(label,vA,vB,lwr=false,unit=''){
    let cls='neu';
    if(vA!=null&&vB!=null&&typeof vA==='number'&&typeof vB==='number'&&Math.abs(vA-vB)>.001)
      cls=((lwr?vA<vB:vA>vB))?'bet':'wrs';
    const fmt=v=>v!=null?`${typeof v==='number'?v.toFixed(typeof v==='number'&&v%1===0?0:2):v}${unit}`:'—';
    const clsB=cls==='bet'?'wrs':cls==='wrs'?'bet':'neu';
    return`<tr><td style="color:var(--muted)">${label}</td><td class="${cls}">${fmt(vA)}</td><td class="${clsB}">${fmt(vB)}</td></tr>`;
  }
  const chartDefs=[
    {key:'gpsStat',title:'GPS Fix Status',step:true},
    {key:'sats',title:'Satellite Count',color:'#22c55e',yMin:0,yFmt:v=>v.toFixed(0)},
    {key:'volt',title:'Battery Voltage',color:'#FA9C21',th:(d)=>[{value:d.stats.warnV,color:'#f97316'},{value:d.stats.critV,color:'#ef4444'}],yFmt:v=>`${v.toFixed(2)}V`},
    {key:'curr',title:'Current Draw (A)',color:'#a855f7',yMin:0,yFmt:v=>`${v.toFixed(1)}A`},
    {key:'agl',title:'AGL (m)',color:'#06b6d4',yFmt:v=>`${v.toFixed(1)}m`},
    {key:'temp',title:'Temperature (°C)',color:'#f97316',yFmt:v=>`${v.toFixed(1)}°C`},
    {key:'spd',title:'H. Speed (m/s)',color:'#06b6d4',yMin:0,yFmt:v=>`${v.toFixed(1)}m/s`},
    {key:'vspd',title:'V. Speed (m/s)',color:'#06b6d4',yFmt:v=>`${v.toFixed(1)}m/s`},
    {key:'yaw',title:'Yaw (°)',color:'#3b82f6',yFmt:v=>`${v.toFixed(1)}°`},
    {key:'pitch',title:'Pitch (°)',color:'#a855f7',yFmt:v=>`${v.toFixed(1)}°`},
    {key:'roll',title:'Roll (°)',color:'#22c55e',yFmt:v=>`${v.toFixed(1)}°`},
    {key:'hacc',title:'GPS H. Accuracy (m)',color:'#f97316',yMin:0,yFmt:v=>`${v.toFixed(2)}m`},
  ].filter(c=>(dA.charts[c.key]&&dA.charts[c.key].length)||(dB.charts[c.key]&&dB.charts[c.key].length));

  dc.innerHTML=`
  <div class="cmpbar">
    <span class="cmplbl">Comparing</span>
    <select class="cmpsel" onchange="cmpA=+this.value;renderCompare()">${drones.map((d,i)=>`<option value="${i}"${i===cmpA?' selected':''}>${d.droneId}</option>`).join('')}</select>
    <span class="cmpvs">vs</span>
    <select class="cmpsel" onchange="cmpB=+this.value;renderCompare()">${drones.map((d,i)=>`<option value="${i}"${i===cmpB?' selected':''}>${d.droneId}</option>`).join('')}</select>
    <div class="cmpleg">
      <div class="cmplegl"><div class="cmpdot" style="background:#FA9C21"></div>${dA.droneId}</div>
      <div class="cmplegl"><div class="cmpdot" style="background:#3b82f6"></div>${dB.droneId}</div>
    </div>
  </div>
  <div class="shd">Metrics Comparison</div>
  <div class="cmpt" style="margin-bottom:13px"><table>
    <thead><tr><th>Metric</th><th class="ta">${dA.droneId}</th><th class="tb">${dB.droneId}</th></tr></thead>
    <tbody>
      ${mrow('Duration',dA.stats.durSecs,dB.stats.durSecs,false,'s')}
      ${mrow('Min Voltage',dA.stats.minV,dB.stats.minV,true,'V')}
      ${mrow('Per Cell Min',(dA.stats.minV&&dA.stats.cells)?dA.stats.minV/dA.stats.cells:null,(dB.stats.minV&&dB.stats.cells)?dB.stats.minV/dB.stats.cells:null,true,'V')}
      ${mrow('Peak HAcc',parseFloat(dA.stats.maxHAcc)||null,parseFloat(dB.stats.maxHAcc)||null,true,'m')}
      ${mrow('Avg Satellites',dA.stats.avgSats,dB.stats.avgSats,false)}
      ${mrow('Max AGL',parseFloat(dA.stats.maxAGL)||null,parseFloat(dB.stats.maxAGL)||null)}
      ${mrow('Max H. Speed',parseFloat(dA.stats.maxSpd)||null,parseFloat(dB.stats.maxSpd)||null)}
      ${mrow('Max Temp',parseFloat(dA.stats.maxTemp)||null,parseFloat(dB.stats.maxTemp)||null,true)}
      ${mrow('Show Messages',dA.stats.showMsgs,dB.stats.showMsgs)}
      ${mrow('Critical Issues',dA.findings.filter(f=>f.sev==='crit').length,dB.findings.filter(f=>f.sev==='crit').length,true)}
      ${mrow('Warnings',dA.findings.filter(f=>f.sev==='warn').length,dB.findings.filter(f=>f.sev==='warn').length,true)}
    </tbody>
  </table></div>
  <div class="shd">Overlaid Telemetry — <span style="color:var(--accent)">■</span> ${dA.droneId} &nbsp;<span style="color:#3b82f6">■</span> ${dB.droneId}</div>
  <div class="cgrd">${chartDefs.map((c,i)=>`
    <div class="cc">
      <div class="cct"><span class="ccdot" style="background:${c.color||'#FA9C21'}"></span>${c.title}</div>
      <div class="cw" id="cmpc${i}"></div>
    </div>`).join('')}
  </div>`;

  requestAnimationFrame(()=>{
    chartDefs.forEach((c,i)=>{
      const el=document.getElementById(`cmpc${i}`);if(!el)return;
      const d1=drones[cmpA].charts[c.key],d2=drones[cmpB].charts[c.key];
      if(c.step)stepChart(el,d1,d2,dur);
      else lineChart(el,d1,{color:c.color||'#FA9C21',yMin:c.yMin,thresholds:c.th?c.th(drones[cmpA]):[],yFmt:c.yFmt||undefined},d2,'#3b82f6',dur);
    });
  });
}

// ── Explorer ──
function filterExplorer(query,di){
  const q=query.trim().toLowerCase();
  const cards=document.querySelectorAll('#expg .ecard');
  if(!q){cards.forEach(c=>c.classList.remove('hidden'));return;}
  let aliasFields=[];
  for(const[key,fields]of Object.entries(SEARCH_ALIASES)){
    if(key.includes(q)||q.includes(key))aliasFields=[...aliasFields,...fields.map(f=>f.toLowerCase())];
  }
  const d=drones[di];
  cards.forEach(card=>{
    const nm=card.querySelector('.ecn')?.textContent||'';
    const info=d.msgTypes[nm]||{num:[],str:[]};
    const allFields=[...info.num,...info.str].map(f=>f.toLowerCase());
    const nmMatch=nm.toLowerCase().includes(q);
    const directMatch=allFields.some(f=>f.includes(q));
    const aliasMatch=aliasFields.length&&allFields.some(f=>aliasFields.includes(f));
    const descMatch=(MSG_DESCS[nm]||'').toLowerCase().includes(q);
    card.classList.toggle('hidden',!nmMatch&&!directMatch&&!aliasMatch&&!descMatch);
  });
}

function toggleExpChart(di,type,field){
  if(!customCharts[di])customCharts[di]=[];
  const idx=customCharts[di].findIndex(c=>c.type===type&&c.field===field);
  const btn=document.getElementById(`ef-${di}-${type}-${field}`);
  if(idx>=0){customCharts[di].splice(idx,1);btn?.classList.remove('on');}
  else{customCharts[di].push({type,field});btn?.classList.add('on');}
  restoreExpCharts(di);
}

function restoreExpCharts(di){
  const cont=document.getElementById('excg');if(!cont)return;
  const charts=customCharts[di]||[];
  if(!charts.length){
    cont.innerHTML='<div class="exp-placeholder">Click any field tag to chart it<br>Then click <strong>⊕ Pin to top</strong> on the chart to add it to the Telemetry section above</div>';
    return;
  }
  const d=drones[di],dur=d.stats.durSecs||0;
  cont.innerHTML=charts.map(c=>`
    <div class="cc">
      <div class="cct" style="flex-wrap:wrap;gap:5px;">
        <span class="ccdot" style="background:#FA9C21"></span>
        <span>${c.type} · ${c.field}</span>
        <button class="pin-add" onclick="addCustomPin(${di},'${c.type}','${c.field}')">⊕ Pin to top</button>
        <span style="cursor:pointer;color:var(--dimmer);font-size:13px;margin-left:2px" onclick="toggleExpChart(${di},'${c.type}','${c.field}')">✕</span>
      </div>
      <div class="cw" id="exc-${c.type}-${c.field}"></div>
    </div>`).join('');
  requestAnimationFrame(()=>{
    for(const c of charts){
      const el=document.getElementById(`exc-${c.type}-${c.field}`);if(!el)continue;
      const raw=(d.rawMsgs[c.type]||[]).filter(m=>m[c.field]!=null&&typeof m[c.field]==='number');
      if(!raw.length){el.innerHTML='<div class="no-data">No data</div>';continue;}
      const tMin=d.stats.tMin;
      let pts=raw.map(m=>({x:((m.TimeUS||tMin)-tMin)/1e6,y:m[c.field]}));
      if(pts.length>600){const st=Math.floor(pts.length/500);pts=pts.filter((_,i)=>i%st===0);}
      lineChart(el,pts,{color:'#FA9C21'},null,'#3b82f6',dur);
      document.getElementById(`ef-${di}-${c.type}-${c.field}`)?.classList.add('on');
    }
  });
}

<!-- ╔═ SECTION: filehandling ═╗ -->
// ═══════════════════════════════════════
//  FILE HANDLING
// ═══════════════════════════════════════
async function processFiles(files){
  document.getElementById('upload').style.display='none';
  document.getElementById('dash').style.display='block';
  document.getElementById('di').innerHTML='<div class="loading"><div class="spinner"></div><div style="color:#555;font-size:13px;margin-top:6px">Parsing log files…</div></div>';
  for(const f of files){
    try{const buf=await f.arrayBuffer();drones.push(analyze(parseLog(buf),f.name));}
    catch(e){showToast(`Error: ${f.name}`);}
  }
  rebuildTabs();renderDrone(drones.length-files.length);
}

function triggerAdd(){
  const i=document.createElement('input');i.type='file';i.accept='.bin';i.multiple=true;
  i.onchange=async e=>{
    const files=[...e.target.files];
    for(const f of files){try{const buf=await f.arrayBuffer();drones.push(analyze(parseLog(buf),f.name));}catch(e){showToast(`Error: ${f.name}`);}}
    rebuildTabs();renderDrone(drones.length-1);
  };i.click();
}

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);}

const dz=document.getElementById('dz'),fi=document.getElementById('fi');
dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('on');});
dz.addEventListener('dragleave',()=>dz.classList.remove('on'));
dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('on');
  const files=[...e.dataTransfer.files].filter(f=>f.name.endsWith('.bin'));
  if(files.length)processFiles(files);});
fi.addEventListener('change',e=>{const files=[...e.target.files];if(files.length)processFiles(files);});
<!-- ╚═ END: filehandling ═╝ -->
</script>
