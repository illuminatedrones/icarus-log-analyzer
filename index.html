<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICARUS — Drone Log Analyzer</title>
<!-- ╔═ SECTION: styles ═╗ -->
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#070707;--s1:#0e0e0e;--s2:#141414;--s3:#1b1b1b;--s4:#222;
  --b1:#1f1f1f;--b2:#2a2a2a;--b3:#333;
  --accent:#FA9C21;--adim:rgba(250,156,33,.11);--aglow:rgba(250,156,33,.22);
  --text:#ececec;--muted:#888;--dim:#555;--dimmer:#3a3a3a;
  --green:#22c55e;--red:#ef4444;--blue:#3b82f6;--purple:#a855f7;--cyan:#06b6d4;--orange:#f97316;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;overflow-x:hidden;
  background-image:radial-gradient(circle,#181818 1px,transparent 1px);background-size:26px 26px;}

/* ── HEADER ── */
.hdr{background:rgba(7,7,7,.97);backdrop-filter:blur(16px);border-bottom:1px solid var(--b1);
  padding:0 16px;display:flex;align-items:center;gap:12px;height:52px;position:sticky;top:0;z-index:200;}
.logo{display:flex;align-items:center;gap:9px;flex-shrink:0;}
.logo-txt{display:flex;flex-direction:column;line-height:1.1;}
.logo-name{font-size:16px;font-weight:800;color:var(--accent);letter-spacing:2.5px;}
.logo-sub{font-size:8px;font-weight:600;color:var(--dim);letter-spacing:1.8px;text-transform:uppercase;}
.hsep{width:1px;height:20px;background:var(--b2);flex-shrink:0;}
.tabs{display:flex;gap:3px;flex:1;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{padding:5px 12px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;
  color:var(--muted);border:none;background:none;transition:all .15s;font-family:var(--font);}
.tab:hover{color:var(--text);background:var(--s3);}
.tab.active{color:var(--accent);background:var(--adim);}
.hbtns{display:flex;gap:6px;flex-shrink:0;}
.hbtn{padding:5px 11px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;
  white-space:nowrap;border:1px solid var(--b2);background:none;color:var(--muted);
  transition:all .15s;font-family:var(--font);}
.hbtn:hover,.hbtn.on{color:var(--accent);border-color:var(--accent);background:var(--adim);}

/* ── UPLOAD ── */
#upload{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 52px);padding:40px 20px;}
.dz{border:1.5px dashed var(--accent);border-radius:20px;padding:60px 80px;text-align:center;
  max-width:520px;width:100%;cursor:pointer;transition:all .2s;background:var(--adim);}
.dz:hover,.dz.on{background:rgba(250,156,33,.17);box-shadow:0 0 50px var(--aglow);}
.dz h2{font-size:22px;font-weight:700;margin-bottom:8px;}
.dz p{font-size:13px;color:var(--muted);line-height:1.75;margin-bottom:26px;}
.dz em{color:var(--dim);font-style:normal;font-size:11.5px;}
.dzbtn{background:var(--accent);color:#000;border:none;padding:11px 28px;border-radius:8px;
  font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font);letter-spacing:.3px;}
.dzbtn:hover{opacity:.84;}
#fi{display:none;}

/* ── DASHBOARD ── */
#dash{display:none;}
.di{padding:16px;max-width:1600px;margin:0 auto;}

/* Compare bar */
.cmpbar{background:linear-gradient(135deg,rgba(59,130,246,.08),rgba(250,156,33,.08));
  border:1px solid var(--b2);border-radius:10px;padding:11px 16px;
  display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.cmplbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);}
.cmpsel{background:var(--s2);border:1px solid var(--b2);color:var(--text);
  padding:5px 9px;border-radius:6px;font-size:12px;font-family:var(--font);cursor:pointer;}
.cmpvs{font-size:12px;font-weight:700;color:var(--dim);}
.cmpleg{display:flex;gap:10px;margin-left:auto;}
.cmplegl{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);}
.cmpdot{width:9px;height:9px;border-radius:50%;}

/* Stats bar */
.sbar{display:flex;margin-bottom:13px;background:var(--s1);border:1px solid var(--b1);
  border-radius:10px;overflow:hidden;flex-wrap:wrap;}
.si{padding:11px 18px;border-right:1px solid var(--b1);flex:1;min-width:90px;}
.si:last-child{border-right:none;}
.sil{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin-bottom:4px;}
.siv{font-size:17px;font-weight:700;color:var(--text);line-height:1;}
.siu{font-size:11px;color:var(--muted);font-weight:400;}

/* Anomaly cards */
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:13px;position:relative;}
.acard{background:var(--s1);border:1px solid var(--b1);border-radius:10px;padding:12px 14px;
  position:relative;overflow:visible;cursor:default;transition:border-color .15s;}
.acard::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;border-radius:10px 10px 0 0;}
.acard.ok::before{background:var(--green);} .acard.warn::before{background:var(--accent);}
.acard.crit::before{background:var(--red);} .acard.info::before{background:var(--blue);}
.acard.ok{border-color:rgba(34,197,94,.12);} .acard.warn{border-color:rgba(250,156,33,.12);}
.acard.crit{border-color:rgba(239,68,68,.12);} .acard.info{border-color:rgba(59,130,246,.12);}
.acl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:5px;}
.acv{font-size:17px;font-weight:700;margin-bottom:3px;line-height:1;}
.acard.ok .acv{color:var(--green);} .acard.warn .acv{color:var(--accent);}
.acard.crit .acv{color:var(--red);} .acard.info .acv{color:var(--blue);}
.acd{font-size:10px;color:var(--muted);line-height:1.4;}
/* Card tooltip */
.acard-tip{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);
  background:#1a1a1a;border:1px solid var(--b3);border-radius:7px;padding:8px 12px;
  font-size:11px;color:var(--muted);width:220px;line-height:1.5;z-index:100;
  pointer-events:none;opacity:0;transition:opacity .15s;white-space:normal;}
.acard:hover .acard-tip{opacity:1;}

/* Section header */
.shd{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.3px;
  color:var(--dim);margin-bottom:9px;margin-top:1px;}

/* Findings */
.findings{display:flex;flex-direction:column;gap:7px;margin-bottom:13px;}
.finding{background:var(--s1);border:1px solid var(--b1);border-left:3px solid;
  border-radius:8px;padding:9px 13px;display:flex;align-items:flex-start;gap:10px;}
.finding.ok{border-left-color:var(--green);} .finding.warn{border-left-color:var(--accent);}
.finding.crit{border-left-color:var(--red);} .finding.info{border-left-color:var(--blue);}
.finding.crit.cascade{border-left-color:#7a3030;background:rgba(239,68,68,.04);opacity:.78;}
.finding.crit.cascade .ft strong{color:#dcdcdc;font-weight:500;}
.fi{font-size:13px;flex-shrink:0;margin-top:1px;}
.ft{font-size:12px;line-height:1.6;color:#aaa;} .ft strong{color:var(--text);font-weight:600;}

/* Time Range Slider */
.trange-wrap{background:var(--s1);border:1px solid var(--b1);border-radius:10px;
  padding:12px 18px;margin-bottom:13px;}
.trange-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.trange-info{font-size:11px;color:var(--muted);}
.trange-reset{background:none;border:1px solid var(--b2);border-radius:5px;color:var(--dim);
  font-size:10px;padding:3px 8px;cursor:pointer;font-family:var(--font);transition:all .15s;}
.trange-reset:hover{color:var(--accent);border-color:var(--accent);}
.trange-track{position:relative;height:24px;display:flex;align-items:center;}
.trange-rail{position:absolute;width:100%;height:3px;background:var(--s3);border-radius:2px;}
.trange-fill{position:absolute;height:3px;background:var(--accent);border-radius:2px;}
.trange-input{position:absolute;width:100%;appearance:none;background:transparent;outline:none;
  height:3px;pointer-events:none;z-index:2;}
.trange-input::-webkit-slider-thumb{appearance:none;width:14px;height:14px;border-radius:50%;
  background:var(--accent);cursor:pointer;pointer-events:all;border:2px solid #070707;
  box-shadow:0 0 6px var(--aglow);}
.trange-input::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--accent);
  cursor:pointer;pointer-events:all;border:2px solid #070707;}

/* Charts */
.cgrd{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:13px;}
@media(max-width:820px){.cgrd{grid-template-columns:1fr;}}
.cc{background:var(--s1);border:1px solid var(--b1);border-radius:10px;padding:15px 15px 11px;}
.cct{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);
  margin-bottom:11px;display:flex;align-items:center;gap:6px;}
.ccdot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.cw{width:100%;height:150px;position:relative;overflow:hidden;}
.cw svg{position:absolute;top:0;left:0;width:100%;height:100%;}
.cw .xhair{position:absolute;top:10px;bottom:30px;width:1px;background:rgba(250,156,33,.35);
  pointer-events:none;display:none;}
.cw .ctip{position:absolute;background:#111;border:1px solid var(--b3);border-radius:6px;
  padding:5px 9px;font-size:10.5px;color:var(--text);pointer-events:none;display:none;
  white-space:nowrap;z-index:10;line-height:1.5;}
.cw .cover{position:absolute;top:0;left:0;right:0;bottom:0;cursor:crosshair;}
.no-data{height:150px;display:flex;align-items:center;justify-content:center;
  color:var(--dimmer);font-size:12px;}

/* Radio section */
.rgrd{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:13px;}
@media(max-width:820px){.rgrd{grid-template-columns:1fr;}}
.rc{background:var(--s1);border:1px solid var(--b1);border-radius:10px;padding:15px;}
.rct{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);
  margin-bottom:11px;display:flex;align-items:center;gap:8px;}
.rbadge{padding:2px 7px;border-radius:4px;font-size:9.5px;font-weight:700;}
.rrow{display:flex;justify-content:space-between;align-items:center;padding:6px 0;
  border-bottom:1px solid var(--b1);font-size:12px;}
.rrow:last-child{border-bottom:none;}
.rk{color:var(--muted);} .rv{font-weight:600;color:var(--text);}

/* Message Explorer */
.explorer{margin-bottom:13px;}
.exph{background:var(--s1);border:1px solid var(--b1);border-radius:10px;
  padding:11px 15px;display:flex;align-items:center;justify-content:space-between;
  cursor:pointer;transition:background .15s;user-select:none;}
.exph:hover{background:var(--s2);}
.exph-l{display:flex;align-items:center;gap:9px;}
.expt{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);}
.expc{font-size:10px;color:var(--dim);}
.exparr{font-size:10px;color:var(--dim);transition:transform .2s;}.exparr.open{transform:rotate(180deg);}
.expb{background:var(--s1);border:1px solid var(--b1);border-top:none;
  border-radius:0 0 10px 10px;padding:13px;display:none;}
.expb.open{display:block;}
.expg{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:7px;margin-bottom:11px;}
.ecard{background:var(--s2);border:1px solid var(--b1);border-radius:8px;padding:9px 11px;}
.ecn{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:2px;font-family:monospace;}
.ecc{font-size:9.5px;color:var(--dim);margin-bottom:5px;}
.ecfs{display:flex;flex-wrap:wrap;gap:3px;}
.ecf{font-size:9.5px;background:var(--s3);border:1px solid var(--b2);border-radius:4px;
  padding:2px 6px;color:var(--muted);cursor:pointer;transition:all .15s;font-family:monospace;}
.ecf:hover,.ecf.on{background:var(--adim);border-color:var(--accent);color:var(--accent);}
.excg{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:11px;}
@media(max-width:820px){.excg{grid-template-columns:1fr;}}

/* Compare table */
.cmpt{background:var(--s1);border:1px solid var(--b1);border-radius:10px;overflow:hidden;margin-bottom:13px;}
.cmpt table{width:100%;border-collapse:collapse;font-size:12px;}
.cmpt th{background:var(--s2);padding:9px 13px;font-size:9.5px;font-weight:700;
  text-transform:uppercase;letter-spacing:.8px;color:var(--muted);}
.cmpt th.ta{color:var(--accent);} .cmpt th.tb{color:var(--blue);}
.cmpt td{padding:9px 13px;border-top:1px solid var(--b1);}
.cmpt tr:hover td{background:var(--s2);}
.bet{color:var(--green);} .wrs{color:var(--red);} .neu{color:var(--muted);}

/* Event table */
.evt{background:var(--s1);border:1px solid var(--b1);border-radius:10px;overflow:hidden;margin-bottom:20px;}
.evt table{width:100%;border-collapse:collapse;font-size:12px;}
.evt th{background:var(--s2);padding:8px 13px;text-align:left;font-size:9.5px;
  font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);}
.evt td{padding:8px 13px;border-top:1px solid var(--b1);color:var(--text);}
.evt tr:hover td{background:var(--s2);}
.bdg{display:inline-flex;align-items:center;padding:2px 7px;border-radius:4px;
  font-size:9.5px;font-weight:700;letter-spacing:.4px;}
.bok{background:rgba(34,197,94,.12);color:var(--green);}
.bwn{background:rgba(250,156,33,.12);color:var(--accent);}
.bct{background:rgba(239,68,68,.12);color:var(--red);}
.bin{background:rgba(59,130,246,.12);color:var(--blue);}

/* Loading */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;gap:14px;}
.spinner{width:34px;height:34px;border:3px solid var(--b2);border-top-color:var(--accent);
  border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.toast{position:fixed;bottom:20px;right:20px;background:var(--s3);border:1px solid var(--b2);
  border-left:3px solid var(--accent);border-radius:8px;padding:10px 15px;font-size:12.5px;
  color:var(--text);z-index:300;transform:translateY(60px);opacity:0;transition:all .25s;}
.toast.show{transform:translateY(0);opacity:1;}

/* Stat bar: allow tooltips to escape, fix overflow */
.sbar{overflow:visible;}
.si{position:relative;cursor:default;}
.si:first-child{border-radius:10px 0 0 10px;}
.si:last-child{border-radius:0 10px 10px 0;}
.si-id .siv{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px;}
/* Stat bar tooltip via data-tip */
.si[data-tip]:hover::after{
  content:attr(data-tip);
  position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%);
  background:#1a1a1a;border:1px solid #333;border-radius:7px;
  padding:7px 11px;font-size:11px;color:#aaa;line-height:1.5;
  width:210px;white-space:normal;z-index:999;pointer-events:none;
  font-weight:400;text-transform:none;letter-spacing:0;
}
/* Explorer panel — always open, side by side */
.explorer-panel{background:var(--s1);border:1px solid var(--b1);border-radius:10px;margin-bottom:13px;overflow:hidden;}
.exp-hdr{padding:11px 15px;border-bottom:1px solid var(--b1);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.exp-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);flex-shrink:0;}
.exp-count{font-size:10px;color:var(--dim);}
.exp-search-wrap input{background:var(--s2);border:1px solid var(--b2);border-radius:6px;color:var(--text);padding:5px 10px;font-size:12px;font-family:var(--font);width:260px;outline:none;transition:border-color .15s;}
.exp-search-wrap input:focus{border-color:var(--accent);}
.exp-search-wrap input::placeholder{color:var(--dimmer);}
.exp-body{display:grid;grid-template-columns:420px 1fr;}
@media(max-width:920px){.exp-body{grid-template-columns:1fr;}}
.exp-list{border-right:1px solid var(--b1);padding:12px;overflow-y:auto;max-height:640px;display:flex;flex-direction:column;gap:8px;}
.exp-charts{padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:11px;align-content:start;}
.exp-placeholder{padding:54px 24px;text-align:center;color:var(--dimmer);font-size:12px;line-height:1.85;grid-column:1/-1;}
.exp-placeholder p{margin:6px 0;}
.exp-placeholder strong{color:var(--accent);font-weight:700;}
.exp-empty{padding:32px 18px;text-align:center;color:var(--dim);font-size:12.5px;line-height:1.7;}
/* Explorer message cards */
.ecard{background:var(--s2);border:1px solid var(--b1);border-radius:8px;padding:11px 13px;position:relative;}
.ecard.hidden{display:none;}
.ecard-desc{display:block;font-size:11.5px;color:#bbb;line-height:1.6;margin:6px 0 9px;white-space:pre-line;}
.ecard-desc strong,.ecard-desc b{color:#fff;font-weight:600;}
.ecard-desc em{color:var(--accent);font-style:normal;font-weight:600;}


/* ── v4: Readability ── */
:root{--muted:#c0c0c0;--dim:#999;}
.sil{font-size:11px!important;color:var(--muted)!important;}
.siv{font-size:18px!important;}
.siu{font-size:12px!important;color:#aaa!important;}
.shd{font-size:11px!important;color:#bbb!important;letter-spacing:1px!important;}
.acl{font-size:10px!important;color:#bbb!important;}
.acv{font-size:18px!important;}
.acd{font-size:12px!important;color:#bbb!important;}
.fi{font-size:15px!important;}
.ft{font-size:13px!important;color:#ccc!important;}
.ft strong{color:#fff!important;}
.ecn{font-size:13px!important;}
.ecc{font-size:11px!important;color:#aaa!important;}
.ecf{font-size:10px!important;padding:3px 7px!important;}
.exp-title{font-size:12px!important;color:#ccc!important;}
.exp-count{font-size:11px!important;color:#aaa!important;}
.exp-search-wrap input{font-size:13px!important;}
.cct{font-size:11px!important;color:#bbb!important;}
.evt td{font-size:13px!important;color:#ddd!important;}
.evt th{font-size:10px!important;color:#bbb!important;}
.cw svg text{font-size:11px;fill:#aaa;}
.rk{color:#bbb!important;} .rv{color:#eee!important;}
.cmplbl,.cmpvs{font-size:13px!important;}
.cmpt td{font-size:13px!important;color:#ddd!important;}
.cmpt th{font-size:10px!important;color:#bbb!important;}
.bdg{font-size:10px!important;}

/* ── v4: Pin button on top charts ── */
.pin-rm{margin-left:auto;background:none;border:none;color:var(--dim);
  font-size:16px;line-height:1;cursor:pointer;padding:0 2px;font-family:var(--font);
  transition:color .15s;flex-shrink:0;}
.pin-rm:hover{color:var(--red);}

/* ── v4: Field pin button in explorer ── */
.ecf-wrap{display:inline-flex;align-items:center;gap:1px;}
.ecf-pin{font-size:9px;color:var(--dim);cursor:pointer;padding:1px 3px;
  border-radius:3px;transition:all .15s;font-weight:700;border:1px solid transparent;
  background:none;font-family:var(--font);}
.ecf-pin:hover{color:var(--accent);border-color:var(--accent);background:var(--adim);}

/* ── v4: AI Question Box ── */
.ai-box{background:linear-gradient(135deg,rgba(250,156,33,.06),rgba(59,130,246,.04));
  border:1px solid rgba(250,156,33,.2);border-radius:12px;padding:16px 18px;margin-bottom:13px;}
.ai-hdr{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.ai-title{font-size:13px;font-weight:700;color:#fff;letter-spacing:.3px;}
.ai-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.ai-row{display:flex;gap:9px;}
.ai-input{flex:1;background:var(--s2);border:1px solid var(--b2);border-radius:8px;
  color:#fff;padding:9px 14px;font-size:13px;font-family:var(--font);outline:none;
  transition:border-color .15s;}
.ai-input:focus{border-color:var(--accent);}
.ai-input::placeholder{color:#555;}
.ai-btn{background:var(--accent);color:#000;border:none;padding:9px 18px;
  border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font);
  white-space:nowrap;transition:opacity .15s;}
.ai-btn:hover{opacity:.85;}
.ai-answer{margin-top:14px;padding:14px 16px;background:rgba(0,0,0,.3);
  border:1px solid var(--b2);border-radius:9px;font-size:13px;line-height:1.7;color:#ddd;}


/* ── v5: Fixed timeline footer ── */

<script>
<!-- ╔═ SECTION: parser ═╗ -->
// ═══════════════════════════════════════
//  PARSER
// ═══════════════════════════════════════
const H1=0xA3,H2=0x95,FMT_T=128;
function parseLog(buf){
  const v=new DataView(buf),len=buf.byteLength;
  const fmts={},msgs={};let pos=0;
  function rs(o,m){let s='';for(let i=0;i<m&&o+i<len;i++){const c=v.getUint8(o+i);if(!c)break;s+=String.fromCharCode(c);}return s;}
  const SZ={b:1,B:1,M:1,h:2,H:2,c:2,C:2,i:4,I:4,e:4,E:4,L:4,f:4,d:8,q:8,Q:8,n:4,N:16,Z:64};
  while(pos<len-3){
    if(v.getUint8(pos)!==H1||v.getUint8(pos+1)!==H2){pos++;continue;}
    const mt=v.getUint8(pos+2);pos+=3;
    if(mt===FMT_T){
      if(pos+86>len)break;
      const type=v.getUint8(pos),ml=v.getUint8(pos+1);
      const name=rs(pos+2,4).replace(/\0/g,'').trim();
      const fmt=rs(pos+6,16).replace(/\0/g,'').trim();
      const cols=rs(pos+22,64).replace(/\0/g,'').trim();
      const labels=cols?cols.split(',').map(s=>s.trim()):[];
      let fsz=0;for(const c of fmt)fsz+=(SZ[c]||0);
      fmts[type]={name,fmt,labels,plen:Math.max(ml-3,fsz)};
      pos+=86;continue;
    }
    const f=fmts[mt];if(!f){pos++;continue;}
    if(pos+f.plen>len)break;
    const fields={};let o=pos;
    for(let i=0;i<f.fmt.length;i++){
      const lbl=f.labels[i]||`f${i}`,c=f.fmt[i];
      try{switch(c){
        case 'b':fields[lbl]=v.getInt8(o);o+=1;break;
        case 'B':case 'M':fields[lbl]=v.getUint8(o);o+=1;break;
        case 'h':fields[lbl]=v.getInt16(o,true);o+=2;break;
        case 'H':fields[lbl]=v.getUint16(o,true);o+=2;break;
        case 'c':fields[lbl]=v.getInt16(o,true)/100;o+=2;break;
        case 'C':fields[lbl]=v.getUint16(o,true)/100;o+=2;break;
        case 'i':fields[lbl]=v.getInt32(o,true);o+=4;break;
        case 'I':fields[lbl]=v.getUint32(o,true);o+=4;break;
        case 'e':fields[lbl]=v.getInt32(o,true)/100;o+=4;break;
        case 'E':fields[lbl]=v.getUint32(o,true)/100;o+=4;break;
        case 'L':fields[lbl]=v.getInt32(o,true)/1e7;o+=4;break;
        case 'f':fields[lbl]=v.getFloat32(o,true);o+=4;break;
        case 'd':fields[lbl]=v.getFloat64(o,true);o+=8;break;
        case 'n':fields[lbl]=rs(o,4);o+=4;break;
        case 'N':fields[lbl]=rs(o,16);o+=16;break;
        case 'Z':fields[lbl]=rs(o,64);o+=64;break;
        case 'q':{const lo=v.getUint32(o,true),hi=v.getInt32(o+4,true);fields[lbl]=hi*4294967296+lo;o+=8;break;}
        case 'Q':{const lo=v.getUint32(o,true),hi=v.getUint32(o+4,true);fields[lbl]=hi*4294967296+lo;o+=8;break;}
      }}catch(e){break;}
    }
    if(!msgs[f.name])msgs[f.name]=[];
    msgs[f.name].push(fields);
    pos+=f.plen;
  }
  return msgs;
}

<!-- ╚═ END: parser ═╝ -->
<!-- ╔═ SECTION: analyzer ═╗ -->
// ═══════════════════════════════════════
//  ANALYZER
// ═══════════════════════════════════════
const MN={0:'Stabilize',1:'Acro',2:'AltHold',3:'Auto',4:'Guided',5:'Loiter',6:'RTL',7:'Circle',9:'Land',11:'Drift',13:'Sport',15:'AutoTune',16:'PosHold',17:'Brake',21:'SmartRTL',23:'Follow',25:'SystemID',27:'AutoRTL'};
const ES={1:'Main',2:'Radio',3:'Compass',4:'OptFlow',5:'Failsafe:Radio',6:'Failsafe:Battery',7:'Failsafe:GPS',8:'Failsafe:GCS',9:'Failsafe:Fence',10:'FlightMode',11:'GPS',12:'CrashCheck',16:'EKF',17:'Failsafe:EKF',18:'BarometerGlitch',22:'Throttle',23:'EKF Primary'};
const GN={0:'No GPS',1:'No Fix',2:'2D Fix',3:'3D Fix',4:'DGPS',5:'RTK Float',6:'RTK Fixed'};
const LAND_MODES=new Set([6,9,21,27]);

function ds(data,max=600){
  if(!data||data.length<=max)return data||[];
  const step=Math.floor(data.length/max);
  return data.filter((_,i)=>i%step===0);
}

function analyze(msgs,filename){
  const r={
    filename,
    droneId:filename.match(/^(\d+-\d+)/)?filename.match(/^(\d+-\d+)/)[1]:filename.replace(/\.bin$/i,''),
    findings:[],cards:[],charts:{},events:[],stats:{},
    msgTypes:{},rawMsgs:msgs
  };

  // Time base
  let tMin=Infinity,tMax=-Infinity;
  for(const arr of Object.values(msgs)){
    if(arr.length&&arr[0].TimeUS!=null){tMin=Math.min(tMin,arr[0].TimeUS);tMax=Math.max(tMax,arr[arr.length-1].TimeUS);}
  }
  if(tMin===Infinity)tMin=0;
  const norm=m=>((m.TimeUS||tMin)-tMin)/1e6;
  r.stats.tMin=tMin;
  const dur=(tMax-tMin)/1e6;
  r.stats.duration=dur>0?`${Math.floor(dur/60)}m ${Math.floor(dur%60)}s`:'—';
  r.stats.durSecs=dur;

  // Message type catalog
  for(const[name,arr]of Object.entries(msgs)){
    if(!arr.length)continue;
    const num=[],str=[];
    for(const[k,v]of Object.entries(arr[0])){if(k==='TimeUS')continue;typeof v==='number'?num.push(k):str.push(k);}
    r.msgTypes[name]={count:arr.length,num,str};
  }

  // ── BATTERY ──
  const batA=msgs['BAT']||msgs['CURR']||[];
  let vf=null,cf=null,tf_bat=null;
  if(batA.length){
    const k=Object.keys(batA[0]);
    vf=k.find(x=>x==='Volt')||k.find(x=>/volt/i.test(x)&&!/servo|vcc/i.test(x));
    cf=k.find(x=>x==='Curr')||k.find(x=>/curr/i.test(x));
    tf_bat=k.find(x=>x==='Temp'||x==='T');
  }
  let vD=[],cD=[],minV=Infinity,maxV=-Infinity,maxSag=0,sagAt=null;
  if(batA.length&&vf){
    vD=batA.filter(m=>(m[vf]||0)>2).map(m=>({x:norm(m),y:m[vf]}));
    if(vD.length){
      minV=Math.min(...vD.map(d=>d.y));maxV=Math.max(...vD.map(d=>d.y));
      for(let i=1;i<vD.length;i++){
        const dt=vD[i].x-vD[i-1].x;
        if(dt>0&&dt<5){const drop=vD[i-1].y-vD[i].y;if(drop>maxSag){maxSag=drop;sagAt=vD[i].x;}}
      }
    }
    if(cf)cD=batA.filter(m=>(m[cf]||0)>=0).map(m=>({x:norm(m),y:m[cf]}));
  }
  r.charts.volt=ds(vD);r.charts.curr=ds(cD);
  r.stats.minV=minV<Infinity?minV:null;r.stats.maxV=maxV>-Infinity?maxV:null;

  const cells=maxV>-Infinity?Math.max(1,Math.round(maxV/4.2)):1;
  r.stats.cells=cells;
  const minVpc=minV<Infinity?minV/cells:null;
  const CRIT_VPC=3.35,WARN_VPC=3.5;
  r.stats.critV=CRIT_VPC*cells;r.stats.warnV=WARN_VPC*cells;

  const maxCurr=cD.length?Math.max(...cD.map(d=>d.y)):null;
  r.stats.maxCurr=maxCurr!=null?`${maxCurr.toFixed(1)}A`:null;

  let bStat='ok',bVal='—',bDesc='No battery data';
  if(vD.length){
    bVal=`${minV.toFixed(2)}V`;bDesc=`${cells}S · ${minV.toFixed(2)}–${maxV.toFixed(2)}V`;
    if(minVpc<CRIT_VPC){bStat='crit';bDesc=`${cells}S min ${minV.toFixed(2)}V — critical`;
      r.findings.push({sev:'crit',icon:'🔋',text:`<strong>Critical battery voltage</strong> — ${cells}S pack minimum ${minV.toFixed(2)}V (${minVpc.toFixed(3)}V/cell). Inspect all cells for damage or deep discharge.`});}
    else if(minVpc<WARN_VPC){bStat='warn';bDesc=`${cells}S min ${minV.toFixed(2)}V — low`;
      r.findings.push({sev:'warn',icon:'🔋',text:`<strong>Low battery voltage</strong> — ${cells}S pack minimum ${minV.toFixed(2)}V (${minVpc.toFixed(3)}V/cell). Verify landing timing and battery condition.`});}
    if(maxSag/cells>0.12)r.findings.push({sev:'warn',t:sagAt,icon:'⚡',text:`<strong>Voltage sag detected</strong> — ${maxSag.toFixed(3)}V drop (${(maxSag/cells).toFixed(3)}V/cell) in &lt;5s at T+${sagAt.toFixed(1)}s. High current demand or weak cells.`});
    if(dur>30&&vD.length>10){
      const lastV=vD[vD.length-1].y,lastVpc=lastV/cells;
      const mA=msgs['MODE']||[],lastM=mA.length?mA[mA.length-1]:null;
      const lastMN=lastM?(lastM.Mode!=null?lastM.Mode:lastM.ModeNum):null;
      const wasLanding=lastMN!=null&&LAND_MODES.has(lastMN);
      const lastSlice=vD.slice(-10);
      const stable=lastSlice[lastSlice.length-1].y>lastSlice[0].y*0.97;
      if(lastVpc>WARN_VPC&&!wasLanding&&stable){
        r.findings.push({sev:'crit',t:vD[vD.length-1].x,icon:'💥',text:`<strong>Possible battery ejection / sudden power loss</strong> — Log ended abruptly at T+${vD[vD.length-1].x.toFixed(1)}s with ${lastV.toFixed(2)}V (${lastVpc.toFixed(2)}V/cell, ~${Math.round(lastVpc/4.2*100)}% charge) and no landing mode active.`});
      }
    }
  }
  r.cards.push({label:'Battery Min',val:bVal,desc:bDesc,status:bStat,
    tip:'Minimum recorded pack voltage. Critical below 6.7V (2S) / 3.35V per cell. Warning below 7.0V / 3.5V per cell.'});

  // ── GPS / RTK — % time at Fixed + longest degraded / lost-fix runs ──
  const gpsA=msgs['GPS']||[],gpaA=msgs['GPA']||[];
  let gpsSt=[],haccD=[],satsD=[],gpsAltD=[],spdD=[];
  let rtkDrops=[],maxHAcc=0,minStat=99,minSats=99,avgSats=0;
  let rtkFixedTime=0,totalGpsTime=0;
  let degStart=null,longestDeg=0,longestDegAt=null;
  let lossStart=null,longestLoss=0,longestLossAt=null;
  if(gpsA.length){
    gpsSt=gpsA.map(m=>({x:norm(m),y:m['Status']||0}));
    if('NSats'in gpsA[0]){
      satsD=gpsA.map(m=>({x:norm(m),y:m['NSats']||0}));
      const sv=satsD.map(d=>d.y).filter(v=>v>0);
      if(sv.length){minSats=Math.min(...sv);avgSats=Math.round(sv.reduce((a,b)=>a+b,0)/sv.length);}
    }
    if('Alt'in gpsA[0])gpsAltD=gpsA.filter(m=>m['Alt']!=null).map(m=>({x:norm(m),y:m['Alt']}));
    if('Spd'in gpsA[0])spdD=gpsA.filter(m=>m['Spd']!=null&&m['Spd']>=0).map(m=>({x:norm(m),y:m['Spd']}));
    let prev=null;
    for(let i=0;i<gpsA.length;i++){
      const m=gpsA[i],s=m['Status']||0,t=norm(m);
      if(s>0&&s<minStat)minStat=s;
      // Transition events (kept for the timeline; just one per dropout)
      if(prev!=null&&prev>=5&&s<5){
        rtkDrops.push({x:t});
        r.events.push({t:t.toFixed(1),type:'RTK Dropout',sev:'warn',detail:`${GN[prev]||prev} → ${GN[s]||s}`});
      }
      // Time-weighted accumulation per status level
      if(i>0){
        const dt=t-norm(gpsA[i-1]);
        if(dt>0&&dt<5){
          totalGpsTime+=dt;
          if(s>=6)rtkFixedTime+=dt;
          if(s<5){
            if(degStart===null)degStart=t-dt;
            const len=t-degStart;if(len>longestDeg){longestDeg=len;longestDegAt=degStart;}
          } else degStart=null;
          if(s<3){
            if(lossStart===null)lossStart=t-dt;
            const len=t-lossStart;if(len>longestLoss){longestLoss=len;longestLossAt=lossStart;}
          } else lossStart=null;
        }
      }
      prev=s;
    }
  }
  if(gpaA.length){
    haccD=gpaA.filter(m=>m['HAcc']!=null&&m['HAcc']<50).map(m=>({x:norm(m),y:m['HAcc']}));
    if(haccD.length)maxHAcc=Math.max(...haccD.map(d=>d.y));
  }
  const rtkFixedPct=totalGpsTime>0?rtkFixedTime/totalGpsTime:0;
  r.stats.rtkFixedPct=totalGpsTime>0?`${(rtkFixedPct*100).toFixed(0)}%`:null;

  // ── AGL — Above Ground Level from BARO RelAlt or BARO Alt offset ──
  // Prefer BARO RelAlt (relative altitude) which is true AGL
  const baroA=msgs['BARO']||[];
  let aglD=[];
  if(baroA.length){
    // RelAlt is AGL; Alt is absolute baro altitude
    const relKey=Object.keys(baroA[0]).find(k=>/relalt|ralt/i.test(k));
    if(relKey){
      aglD=baroA.filter(m=>m[relKey]!=null).map(m=>({x:norm(m),y:m[relKey]}));
    } else if('Alt'in baroA[0]){
      // Use baro Alt and zero-reference to takeoff altitude
      const rawBaro=baroA.filter(m=>m['Alt']!=null).map(m=>({x:norm(m),y:m['Alt']}));
      if(rawBaro.length){
        const groundAlt=rawBaro.slice(0,Math.min(10,rawBaro.length)).reduce((s,d)=>s+d.y,0)/Math.min(10,rawBaro.length);
        aglD=rawBaro.map(d=>({x:d.x,y:d.y-groundAlt}));
      }
    }
  }
  // Fallback: GPS relative altitude
  if(!aglD.length&&gpsA.length){
    const relKey=Object.keys(gpsA[0]).find(k=>/relalt|ralt/i.test(k));
    if(relKey)aglD=gpsA.filter(m=>m[relKey]!=null).map(m=>({x:norm(m),y:m[relKey]}));
  }

  r.charts.gpsStat=ds(gpsSt);r.charts.hacc=ds(haccD);
  r.charts.sats=ds(satsD);r.charts.gpsAlt=ds(gpsAltD);r.charts.agl=ds(aglD);r.charts.spd=ds(spdD);
  r.stats.maxHAcc=maxHAcc>0?`${maxHAcc.toFixed(2)}m`:null;
  r.stats.minSats=minSats<99?minSats:null;r.stats.avgSats=avgSats||null;
  r.stats.minGpsFix=minStat<99?minStat:null;
  r.stats.minGpsFixStr=minStat<99?(GN[minStat]||String(minStat)):null;

  const maxAGL=aglD.length?Math.max(...aglD.map(d=>d.y)):null;
  r.stats.maxAGL=maxAGL!=null?`${maxAGL.toFixed(1)}m`:null;
  const maxGpsAlt=gpsAltD.length?Math.max(...gpsAltD.map(d=>d.y)):null;
  r.stats.maxGpsAlt=maxGpsAlt!=null?`${maxGpsAlt.toFixed(1)}m`:null;
  // backward compat
  r.stats.maxAlt=r.stats.maxAGL||r.stats.maxGpsAlt;

  const maxSpd=spdD.length?Math.max(...spdD.map(d=>d.y)):null;
  r.stats.maxSpd=maxSpd!=null?`${maxSpd.toFixed(1)} m/s`:null;

  // Vertical speed — prefer BARO.CRt (autopilot-computed), else AGL derivative
  let vspdD=[],maxVSpd=null;
  if(baroA.length&&'CRt'in baroA[0]){
    // CRt is climb rate; detect unit: m/s vs cm/s
    const crSample=baroA.filter(m=>m['CRt']!=null).map(m=>Math.abs(m['CRt']));
    const maxCr=crSample.length?Math.max(...crSample):0;
    const scale=maxCr>50?0.01:1; // cm/s → m/s if values look like cm/s
    vspdD=baroA.filter(m=>m['CRt']!=null&&Math.abs(m['CRt']*scale)<25)
      .map(m=>({x:norm(m),y:m['CRt']*scale}));
  } else {
    const altSrc=aglD.length?aglD:gpsAltD;
    if(altSrc.length>1){
      for(let i=1;i<altSrc.length;i++){
        const dt=altSrc[i].x-altSrc[i-1].x;
        if(dt>0&&dt<2){
          const vs=(altSrc[i].y-altSrc[i-1].y)/dt;
          // Skip pre-flight ground noise: only include when airborne or past 5s
          const midAgl=(altSrc[i].y+altSrc[i-1].y)/2;
          if(Math.abs(vs)<20&&(midAgl>0.4||altSrc[i].x>5)){
            vspdD.push({x:altSrc[i].x,y:vs});
          }
        }
      }
    }
  }
  if(vspdD.length)maxVSpd=Math.max(...vspdD.map(d=>Math.abs(d.y)));
  r.charts.vspd=ds(vspdD);
  r.stats.maxVSpd=maxVSpd!=null?`${maxVSpd.toFixed(1)} m/s`:null;

  let gStat='ok',gVal='—',gDesc='No GPS data';
  if(gpsA.length){
    // Show-killers: hard fix loss + severe RTK degradation
    if(longestLoss>2&&longestLossAt!=null)
      r.findings.push({sev:'crit',t:longestLossAt,icon:'📡',text:`<strong>GPS lost fix entirely</strong> — no 3D fix for ${longestLoss.toFixed(1)}s starting T+${longestLossAt.toFixed(1)}s. Drone was flying on dead-reckoning; the show position commands meant nothing during this window.`});
    if(rtkFixedPct<0.5&&totalGpsTime>10)
      r.findings.push({sev:'crit',icon:'📡',text:`<strong>RTK Fixed only ${(rtkFixedPct*100).toFixed(0)}% of flight</strong> — drone spent most of the show on degraded positioning. Pixel-precise placement was severely compromised. Check base-station link, antenna mounting, and RF environment at the show site.`});
    else if(rtkFixedPct<0.8&&totalGpsTime>10)
      r.findings.push({sev:'warn',icon:'📡',text:`<strong>RTK Fixed ${(rtkFixedPct*100).toFixed(0)}% of flight</strong> — intermittent fix loss likely caused visible position drift in the formation.`});
    if(longestDeg>10&&longestDegAt!=null)
      r.findings.push({sev:'crit',t:longestDegAt,icon:'📡',text:`<strong>RTK degraded continuously for ${longestDeg.toFixed(1)}s</strong> starting T+${longestDegAt.toFixed(1)}s — sustained loss of pixel-perfect positioning during the show window.`});
    else if(longestDeg>3&&longestDegAt!=null)
      r.findings.push({sev:'warn',t:longestDegAt,icon:'📡',text:`<strong>RTK degraded for ${longestDeg.toFixed(1)}s</strong> starting T+${longestDegAt.toFixed(1)}s.`});
    if(maxHAcc>2.0)
      r.findings.push({sev:'warn',icon:'🎯',text:`<strong>GPS accuracy spike</strong> — HAcc peaked at ${maxHAcc.toFixed(2)}m (ideal &lt;0.5m). Look for multipath at that timestamp (buildings, water, neighbouring drones).`});
    if(minSats<6&&minSats>0)
      r.findings.push({sev:'warn',icon:'🛰️',text:`<strong>Very low satellite count</strong> — min ${minSats} sats. Insufficient geometry for reliable RTK lock.`});

    gVal=totalGpsTime>0?`${(rtkFixedPct*100).toFixed(0)}% RTK`:(GN[minStat]||'OK');
    gDesc=longestLoss>2?`Lost fix ${longestLoss.toFixed(1)}s`
         :longestDeg>3?`Degraded ${longestDeg.toFixed(1)}s`
         :rtkFixedPct>0.99?'Locked entire flight'
         :rtkDrops.length?`${rtkDrops.length} brief dropout${rtkDrops.length>1?'s':''}`
         :'Mostly clean';
    gStat=(rtkFixedPct<0.5||longestLoss>2||longestDeg>10)?'crit'
         :(rtkFixedPct<0.8||longestDeg>3||maxHAcc>2.0)?'warn'
         :'ok';
  }
  r.cards.push({label:'RTK Status',val:gVal,desc:gDesc,status:gStat,
    tip:'Percentage of flight at RTK Fixed (status=6). 100% = pixel-precise positioning the entire show. Below 80% = visible formation drift. Below 50% = severely compromised.'});
  // Satellites, Max AGL, Max H. Speed shown in stats bar — no card duplication

  // ── ATTITUDE: YAW / PITCH / ROLL — sustained-spin detection ──
  const attA=msgs['ATT']||[];
  let yawD=[],pitchD=[],rollD=[],maxPitch=null,maxRoll=null;
  let yawRates=[],peakYawRate=0;
  let spinStart=null,longestSpin=0,spinAt=null,spinPeakRate=0;
  const SPIN_RATE=30;     // °/s rolling-mean threshold (light-show calibrated)
  const SPIN_WINDOW=1.0;  // seconds of rolling mean
  if(attA.length){
    yawD=attA.map(m=>({x:norm(m),y:m['Yaw']||0}));
    // Per-sample signed yaw rate (handles 360° wrap)
    for(let i=1;i<yawD.length;i++){
      const dt=yawD[i].x-yawD[i-1].x;
      if(dt>0&&dt<2){
        let dy=yawD[i].y-yawD[i-1].y;
        if(dy>180)dy-=360; else if(dy<-180)dy+=360;
        const rate=dy/dt;
        yawRates.push({x:yawD[i].x,y:rate});
        if(Math.abs(rate)>peakYawRate)peakYawRate=Math.abs(rate);
      }
    }
    // Sustained-spin detection — rolling 1s window mean rate
    let wIdx=0,sum=0;
    for(let i=0;i<yawRates.length;i++){
      sum+=yawRates[i].y;
      while(yawRates[wIdx].x<yawRates[i].x-SPIN_WINDOW){sum-=yawRates[wIdx].y;wIdx++;}
      const n=i-wIdx+1;
      const mean=Math.abs(sum/n);
      if(n>=3&&mean>SPIN_RATE){
        if(spinStart===null)spinStart=yawRates[wIdx].x;
        const len=yawRates[i].x-spinStart;
        if(len>longestSpin){longestSpin=len;spinAt=spinStart;}
        if(mean>spinPeakRate)spinPeakRate=mean;
      } else spinStart=null;
    }
    if('Pitch'in attA[0]){pitchD=attA.filter(m=>m['Pitch']!=null).map(m=>({x:norm(m),y:m['Pitch']}));if(pitchD.length)maxPitch=Math.max(...pitchD.map(d=>Math.abs(d.y)));}
    if('Roll'in attA[0]){rollD=attA.filter(m=>m['Roll']!=null).map(m=>({x:norm(m),y:m['Roll']}));if(rollD.length)maxRoll=Math.max(...rollD.map(d=>Math.abs(d.y)));}
  }
  r.charts.yaw=ds(yawD);r.charts.pitch=ds(pitchD);r.charts.roll=ds(rollD);
  r.stats.maxPitch=maxPitch!=null?`${maxPitch.toFixed(1)}°`:null;
  r.stats.maxRoll=maxRoll!=null?`${maxRoll.toFixed(1)}°`:null;
  r.stats.peakYawRate=peakYawRate>0?`${peakYawRate.toFixed(0)}°/s`:null;

  let yStat='ok',yVal='Clear',yDesc='Stable orientation';
  if(longestSpin>2&&spinAt!=null){
    const sev=longestSpin>5?'crit':'warn';
    yStat=sev;
    yVal=`${spinPeakRate.toFixed(0)}°/s × ${longestSpin.toFixed(1)}s`;
    yDesc=longestSpin>5?'Uncontrolled spin':'Sustained yaw';
    r.findings.push({sev,t:spinAt,icon:'🌀',text:`<strong>Sustained yaw spin</strong> — drone rotated at ~${spinPeakRate.toFixed(0)}°/s averaged over ${longestSpin.toFixed(1)}s starting T+${spinAt.toFixed(1)}s. For a light show this is highly visible — drone left its commanded heading. Likely cause: prop strike, motor loss, yaw-PID divergence, or collision with a neighbor.`});
    r.events.push({t:spinAt.toFixed(1),type:'Yaw Spin',sev,detail:`~${spinPeakRate.toFixed(0)}°/s for ${longestSpin.toFixed(1)}s`});
  }
  r.cards.push({label:'Yaw Stability',val:yVal,desc:yDesc,status:yStat,
    tip:'Detects sustained uncontrolled yaw rotation using a 1-second rolling window. Single-sample noise is ignored. For light shows, even brief sustained spin (>2s) is visible to viewers; >5s = loss of orientation control.'});

  // ── TEMPERATURE ──
  const imuA=msgs['IMU']||[];
  let tempD=[];
  if(imuA.length&&'T'in imuA[0]){
    tempD=imuA.filter(m=>m['T']!=null&&m['T']>-40&&m['T']<120).map(m=>({x:norm(m),y:m['T']}));
  }else if(baroA.length&&'Temp'in baroA[0]){
    tempD=baroA.filter(m=>m['Temp']!=null).map(m=>({x:norm(m),y:m['Temp']}));
  }else if(tf_bat&&batA.length){
    tempD=batA.filter(m=>m[tf_bat]!=null&&m[tf_bat]>-40).map(m=>({x:norm(m),y:m[tf_bat]}));
  }
  r.charts.temp=ds(tempD);
  const maxTemp=tempD.length?Math.max(...tempD.map(d=>d.y)):null;
  r.stats.maxTemp=maxTemp!=null?`${maxTemp.toFixed(1)}°C`:null;
  if(maxTemp!=null&&maxTemp>85)r.findings.push({sev:'warn',icon:'🌡️',text:`<strong>High temperature</strong> — IMU/sensor temperature reached ${maxTemp.toFixed(1)}°C. Check for thermal management issues.`});

  // ── VIBRATION (VIBE) — props/mount/dampening ──
  const vibA=msgs['VIBE']||[];
  let vibeZD=[],maxVib=0,maxVibAt=null,clipMax=0;
  if(vibA.length){
    const k=Object.keys(vibA[0]);
    const vx=k.find(x=>/^VibeX$/i.test(x)),vy=k.find(x=>/^VibeY$/i.test(x)),vz=k.find(x=>/^VibeZ$/i.test(x));
    if(vx&&vy&&vz){
      const vxD=vibA.filter(m=>m[vx]!=null).map(m=>({x:norm(m),y:m[vx]}));
      const vyD=vibA.filter(m=>m[vy]!=null).map(m=>({x:norm(m),y:m[vy]}));
      vibeZD=vibA.filter(m=>m[vz]!=null).map(m=>({x:norm(m),y:m[vz]}));
      // Track peak + when it occurred (lets us tell chronic vibration from impact spike)
      let px=0,py=0,pz=0;
      for(const d of vxD)if(d.y>px)px=d.y;
      for(const d of vyD)if(d.y>py)py=d.y;
      for(const d of vibeZD)if(d.y>pz)pz=d.y;
      for(const d of vxD)if(d.y>maxVib){maxVib=d.y;maxVibAt=d.x;}
      for(const d of vyD)if(d.y>maxVib){maxVib=d.y;maxVibAt=d.x;}
      for(const d of vibeZD)if(d.y>maxVib){maxVib=d.y;maxVibAt=d.x;}
      if(maxVib>60)r.findings.push({sev:'crit',cat:'effect',t:maxVibAt,icon:'📳',text:`<strong>Critical vibration</strong> — peak ${maxVib.toFixed(1)} m/s² (X:${px.toFixed(0)} Y:${py.toFixed(0)} Z:${pz.toFixed(0)}) at T+${(maxVibAt||0).toFixed(1)}s. Will degrade EKF position estimate. Inspect props for damage, motor mounts for looseness, FC vibration dampening.`});
      else if(maxVib>30)r.findings.push({sev:'warn',cat:'effect',t:maxVibAt,icon:'📳',text:`<strong>Elevated vibration</strong> — peak ${maxVib.toFixed(1)} m/s² at T+${(maxVibAt||0).toFixed(1)}s (target &lt;30). Inspect props for nicks, motor balance, FC dampening foam.`});
    }
    const cl=['Clip0','Clip1','Clip2'].map(c=>(vibA[vibA.length-1]||{})[c]||0);
    clipMax=Math.max(...cl);
    if(clipMax>0)r.findings.push({sev:clipMax>1000?'crit':'warn',cat:'effect',icon:'⚠️',text:`<strong>Accelerometer clipping</strong> — ${clipMax} clip event${clipMax>1?'s':''} on the worst IMU. Sensor saturated by extreme vibration; position/velocity estimates were unreliable while clipping was active.`});
  }
  r.charts.vibe=ds(vibeZD);
  r.stats.maxVib=maxVib>0?`${maxVib.toFixed(1)} m/s²`:null;
  r.stats.clipEvents=clipMax||null;

  // ── EKF VARIANCE (NKF4 / XKF4) — sensor-fusion confidence ──
  const nkf4=msgs['NKF4']||msgs['XKF4']||[];
  let ekfVarD=[],ekfMaxV=0,ekfMaxVAt=null;
  if(nkf4.length){
    const k=Object.keys(nkf4[0]);
    const vKeys=['SV','SP','SH','SM'].filter(x=>k.includes(x));
    if(vKeys.length){
      for(const m of nkf4){
        let mx=0;for(const kk of vKeys){const v=m[kk];if(v!=null&&v>mx)mx=v;}
        const t=norm(m);
        if(mx>0)ekfVarD.push({x:t,y:mx});
        if(mx>ekfMaxV){ekfMaxV=mx;ekfMaxVAt=t;}
      }
      if(ekfMaxV>1.0)r.findings.push({sev:'crit',cat:'effect',t:ekfMaxVAt,icon:'🧭',text:`<strong>EKF variance critical</strong> — peak innovation ratio ${ekfMaxV.toFixed(2)} at T+${(ekfMaxVAt||0).toFixed(1)}s (>1.0 = filter rejected its own sensors). Often the root cause of unexplained RTL/Land or position drift. Check vibration, GPS quality, compass calibration.`});
      else if(ekfMaxV>0.5)r.findings.push({sev:'warn',cat:'effect',t:ekfMaxVAt,icon:'🧭',text:`<strong>EKF variance elevated</strong> — peak ratio ${ekfMaxV.toFixed(2)} at T+${(ekfMaxVAt||0).toFixed(1)}s (target &lt;0.5). Sensor fusion is under stress; review GPS HAcc and vibration in the same window.`});
    }
  }
  r.charts.ekfVar=ds(ekfVarD);
  r.stats.ekfMaxV=ekfMaxV>0?ekfMaxV.toFixed(2):null;

  // ── COMPASS / MAG FIELD STABILITY ──
  const magA=msgs['MAG']||[];
  let magFieldD=[];
  if(magA.length){
    const k=Object.keys(magA[0]);
    const mx=k.find(x=>/^MagX$/i.test(x)),my=k.find(x=>/^MagY$/i.test(x)),mz=k.find(x=>/^MagZ$/i.test(x));
    if(mx&&my&&mz){
      magFieldD=magA.filter(m=>m[mx]!=null&&m[my]!=null&&m[mz]!=null)
        .map(m=>({x:norm(m),y:Math.sqrt(m[mx]*m[mx]+m[my]*m[my]+m[mz]*m[mz])}));
      if(magFieldD.length>10){
        const mags=magFieldD.map(d=>d.y);
        const minF=Math.min(...mags),maxF=Math.max(...mags);
        if(maxF>0){
          const swing=(maxF-minF)/maxF;
          if(swing>0.45)r.findings.push({sev:'warn',icon:'🧲',text:`<strong>Compass field instability</strong> — magnetic field magnitude varied ${(swing*100).toFixed(0)}% (${minF.toFixed(0)}–${maxF.toFixed(0)} mGauss). Likely current-induced interference from motors/ESCs near the compass — yaw estimate will drift under load.`});
        }
      }
    }
  }
  r.charts.mag=ds(magFieldD);

  // ── WIND ESTIMATE (NKF2 / XKF2) ──
  const nkf2=msgs['NKF2']||msgs['XKF2']||[];
  let windD=[],maxWind=0;
  if(nkf2.length){
    const k=Object.keys(nkf2[0]);
    const wn=k.find(x=>/^VWN$/i.test(x)),we=k.find(x=>/^VWE$/i.test(x));
    if(wn&&we){
      windD=nkf2.filter(m=>m[wn]!=null&&m[we]!=null)
        .map(m=>({x:norm(m),y:Math.sqrt(m[wn]*m[wn]+m[we]*m[we])}));
      if(windD.length){
        maxWind=Math.max(...windD.map(d=>d.y));
        if(maxWind>12)r.findings.push({sev:'warn',icon:'💨',text:`<strong>High wind estimated</strong> — EKF wind solution peaked at ${maxWind.toFixed(1)} m/s (~${(maxWind*2.237).toFixed(0)} mph). Light-show formation accuracy degrades visibly above 8 m/s.`});
      }
    }
  }
  r.charts.wind=ds(windD);
  r.stats.maxWind=maxWind>0?`${maxWind.toFixed(1)} m/s`:null;

  // ── PERFORMANCE MONITOR (PM) — loop overruns / log drops ──
  const pmA=msgs['PM']||[];
  let peakLoop=0,totalLong=0,totalDrops=0;
  if(pmA.length){
    const k=Object.keys(pmA[0]);
    const maxTk=k.find(x=>/MaxT/i.test(x));
    const nlonk=k.find(x=>/NLon/i.test(x));
    const lDropk=k.find(x=>/LogDrop/i.test(x));
    for(const m of pmA){
      if(maxTk&&m[maxTk]!=null&&m[maxTk]>peakLoop)peakLoop=m[maxTk];
      if(nlonk&&m[nlonk]!=null)totalLong+=m[nlonk];
      if(lDropk&&m[lDropk]!=null)totalDrops+=m[lDropk];
    }
    if(peakLoop>10000)r.findings.push({sev:'warn',icon:'⏱️',text:`<strong>Autopilot loop overrun</strong> — peak scheduler loop ${peakLoop}µs (target &lt;2500µs at 400Hz). Flight controller CPU is severely stressed; control updates were delayed.`});
    if(totalDrops>500)r.findings.push({sev:totalDrops>5000?'crit':'warn',icon:'💾',text:`<strong>${totalDrops} log records dropped</strong> — SD card couldn't keep up. Significant flight data is missing from this log; replace card or lower LOG_BITMASK.`});
  }
  r.stats.peakLoop=peakLoop>0?`${peakLoop}µs`:null;

  // ── EVENTS (EV) — disarm reason, failsafe IDs ──
  const EV_NAMES={7:'Auto Armed',8:'Takeoff',9:'Land Complete (maybe)',10:'Land Complete',11:'Lost GPS',15:'Crash Check',17:'EKF Failsafe',18:'EKF Failsafe Cleared',19:'GCS Failsafe',20:'GCS Failsafe Cleared',21:'Failsafe Cleared',22:'Bad Battery',23:'Bad Battery Cleared',24:'Force Land',25:'Throttle Failsafe',26:'Throttle Failsafe Cleared',28:'Heli Land Aborted',30:'Standby On',31:'Standby Off',41:'Surface Tracking',42:'Stall',43:'Vector RTL',45:'Parachute',54:'Auto Disarmed'};
  const EV_CRIT=new Set([11,15,17,19,22,24,25,28,42,45,54]);
  const evA=msgs['EV']||[];
  for(const e of evA){
    const id=e['Id']!=null?e['Id']:(e['id']!=null?e['id']:e['EventId']);
    if(id==null)continue;
    const name=EV_NAMES[id]||`Event ${id}`;
    const crit=EV_CRIT.has(id);
    r.events.push({t:norm(e).toFixed(1),type:name,sev:crit?'crit':'info',detail:`EV id=${id}`});
    if(crit)r.findings.push({sev:'crit',t:norm(e),icon:'🚨',text:`<strong>${name}</strong> — autopilot raised event id ${id} at T+${norm(e).toFixed(1)}s. This is the autopilot's own record of why something went wrong.`});
  }

  // ── MSG TEXT — autopilot's own diagnostic strings ──
  const msgA=msgs['MSG']||[];
  const MSG_PATTERNS=[
    {re:/crash(ed)?/i,sev:'crit',type:'Crash Detected'},
    {re:/parachute/i,sev:'crit',type:'Parachute'},
    {re:/(throttle|radio|RC).*failsafe/i,sev:'crit',type:'RC Failsafe'},
    {re:/battery.*(low|critical|failsafe)/i,sev:'crit',type:'Battery Failsafe'},
    {re:/(geofence|fence breach|fence engaged)/i,sev:'crit',type:'Geofence'},
    {re:/EKF.*(variance|reset|primary changed|lane)/i,sev:'warn',type:'EKF Issue'},
    {re:/GPS.*(glitch|lost|failsafe)/i,sev:'warn',type:'GPS Glitch'},
    {re:/(compass|mag).*(variance|inconsistent|unhealthy)/i,sev:'warn',type:'Compass Issue'},
    {re:/PreArm/i,sev:'warn',type:'PreArm Check'},
    {re:/SmartRTL/i,sev:'warn',type:'SmartRTL'},
    {re:/^RTL\b|switching to RTL/i,sev:'warn',type:'RTL Triggered'},
    {re:/land complete|landed/i,sev:'info',type:'Land Complete'},
    {re:/disarmed/i,sev:'info',type:'Disarmed'},
    {re:/^armed|arming/i,sev:'info',type:'Armed'},
  ];
  const _seenMsg=new Set();
  for(const m of msgA){
    const txt=(m['Message']||m['Msg']||'').trim();
    if(!txt)continue;
    for(const p of MSG_PATTERNS){
      if(p.re.test(txt)){
        r.events.push({t:norm(m).toFixed(1),type:p.type,sev:p.sev,detail:txt.slice(0,140)});
        if(p.sev==='crit'){
          const key=p.type+':'+txt.slice(0,80);
          if(!_seenMsg.has(key)){
            _seenMsg.add(key);
            const safe=txt.replace(/[<>&]/g,'').slice(0,160);
            r.findings.push({sev:'crit',t:norm(m),icon:'📢',text:`<strong>${p.type}</strong> — autopilot reported "${safe}" at T+${norm(m).toFixed(1)}s.`});
          }
        }
        break;
      }
    }
  }

  // ── POSITION CONTROLLER ERROR (PSCN/PSCE/PSCD desired vs actual) ──
  let maxPosErr=0,posErrAt=null,posErrAxis=null;
  for(const k of ['PSCN','PSCE','PSCD']){
    const arr=msgs[k]||[];if(!arr.length)continue;
    const ks=Object.keys(arr[0]);
    const tk=ks.find(x=>/^TP[NED]$/.test(x));
    const ak=ks.find(x=>/^P[NED]$/.test(x));
    if(!tk||!ak)continue;
    for(const m of arr){
      if(m[tk]==null||m[ak]==null)continue;
      const e=Math.abs(m[tk]-m[ak]);
      if(e>maxPosErr){maxPosErr=e;posErrAt=norm(m);posErrAxis=k.replace('PSC','');}
    }
  }
  if(maxPosErr>3&&posErrAt!=null)r.findings.push({sev:maxPosErr>5?'crit':'warn',cat:'effect',t:posErrAt,icon:'🎯',text:`<strong>Position tracking error</strong> — drone deviated up to ${maxPosErr.toFixed(2)}m on the ${posErrAxis} axis from commanded position at T+${posErrAt.toFixed(1)}s. For a light-show drone this is highly visible — formation pixel was off-target.`});
  r.stats.maxPosErr=maxPosErr>0?`${maxPosErr.toFixed(2)}m`:null;

  // ── MODE CHANGES ──
  const modeA=msgs['MODE']||[];
  for(const m of modeA){const mode=m['Mode']!=null?m['Mode']:m['ModeNum'];
    r.events.push({t:norm(m).toFixed(1),type:'Mode Change',sev:'info',detail:`→ ${MN[mode]||'Mode '+mode}`});}
  r.cards.push({label:'Mode Changes',val:modeA.length||0,desc:modeA.length>5?'Frequent — review':modeA.length?'Changes logged':'No changes',
    status:modeA.length>5?'warn':'ok',tip:'Flight mode transitions (Auto, Guided, RTL, Land, etc.). Unexpected mode changes during a show can indicate GCS intervention or failsafe triggers.'});

  // ── ERRORS ──
  const errA=msgs['ERR']||[];
  const actErrs=errA.filter(e=>(e['ECode']||0)!==0);
  const clrErrs=errA.filter(e=>(e['ECode']||0)===0);
  for(const e of actErrs){const sub=ES[e['Subsys']]||`Subsys ${e['Subsys']}`;
    r.events.push({t:norm(e).toFixed(1),type:'Error',sev:'crit',detail:`${sub} ECode:${e['ECode']}`});
    r.findings.push({sev:'crit',cat:'effect',t:norm(e),icon:'⚠️',text:`<strong>System error: ${sub}</strong> — ECode ${e['ECode']} at T+${norm(e).toFixed(1)}s.`});}
  for(const e of clrErrs){const sub=ES[e['Subsys']]||`Subsys ${e['Subsys']}`;
    r.events.push({t:norm(e).toFixed(1),type:'Status Clear',sev:'info',detail:`${sub} cleared`});}
  r.cards.push({label:'Errors',val:actErrs.length,desc:actErrs.length?`${actErrs.length} active`:clrErrs.length?`${clrErrs.length} transitions`:'No errors',
    status:actErrs.length?actErrs.length<3?'warn':'crit':'ok',
    tip:'ECode 0 means a system returned to normal (shown as info). Non-zero ECodes indicate active faults that need investigation.'});

  // ── SHOW SYNC ──
  const showA=msgs['SHOW']||msgs['GUIA']||msgs['SIDS']||[];
  r.cards.push({label:'Show Sync',val:showA.length>0?'Active':'—',desc:showA.length?`${showA.length} swarm msgs`:'No swarm sync data',
    status:'info',tip:'Swarm coordination messages (SHOW/GUIA/SIDS). Indicates the drone was participating in a choreographed light show with position sync commands.'});
  r.stats.showMsgs=showA.length;

  // ── MOTOR ──
  const rcA=msgs['RCOU']||msgs['RCOUT']||[];
  if(rcA.length){
    const chs=['C1','C2','C3','C4','C5','C6','C7','C8'];
    const lift=['C1','C2','C3','C4'];
    let maxImb=0,imbAt=null;
    let satRunStart=null,longestSatRun=0,satRunAt=null;
    for(const m of rcA){
      const vals=chs.map(c=>m[c]).filter(v=>v!=null&&v>900&&v<2100);
      if(vals.length>=4){const rng=Math.max(...vals)-Math.min(...vals);if(rng>maxImb){maxImb=rng;imbAt=norm(m);}}
      const lv=lift.map(c=>m[c]).filter(v=>v!=null&&v>900&&v<2100);
      const allHigh=lv.length>=4&&lv.every(v=>v>=1900);
      const t=norm(m);
      if(allHigh){
        if(satRunStart===null)satRunStart=t;
        const runLen=t-satRunStart;
        if(runLen>longestSatRun){longestSatRun=runLen;satRunAt=satRunStart;}
      } else satRunStart=null;
    }
    if(maxImb>400){r.findings.push({sev:'warn',cat:'effect',t:imbAt,icon:'🔧',text:`<strong>Motor output imbalance</strong> — PWM spread of ${maxImb.toFixed(0)} units at T+${imbAt.toFixed(1)}s. Check motor/ESC condition and propeller balance.`});
      r.events.push({t:imbAt.toFixed(1),type:'Motor Imbalance',sev:'warn',detail:`PWM spread ${maxImb.toFixed(0)} units`});}
    if(longestSatRun>1.0&&satRunAt!=null){
      const sev=longestSatRun>3?'crit':'warn';
      r.findings.push({sev,t:satRunAt,icon:'🔥',text:`<strong>Motor saturation</strong> — all four lift motors held ≥1900 PWM for ${longestSatRun.toFixed(1)}s starting T+${satRunAt.toFixed(1)}s. Drone is overweight, climbing too aggressively, or losing thrust authority — risk of imminent altitude loss / fall-out.`});
      r.events.push({t:satRunAt.toFixed(1),type:'Motor Saturation',sev,detail:`Sustained ${longestSatRun.toFixed(1)}s at ≥1900 PWM`});
    }
  }

  // ── RADIO (RSSI chart only — no stats panel) ──
  const radioA=msgs['RADIO']||[];
  if(radioA.length){
    r.charts.rssi=ds(radioA.filter(m=>m['rssi']!=null).map(m=>({x:norm(m),y:m['rssi']})));
    const rxerrors=(radioA[radioA.length-1]||{}).rxerrors||0;
    if(rxerrors>50)r.findings.push({sev:'warn',icon:'📻',text:`<strong>SiK radio errors (MAV2)</strong> — ${rxerrors} receive errors detected. Check antenna orientation and link quality.`});
  }

  r.events.sort((a,b)=>parseFloat(a.t)-parseFloat(b.t));

  // ── CASCADE DEMOTER — if there's a clear in-flight cause, demote downstream effects ──
  // "Effect" findings (vibration peak, EKF variance, accel clipping, system errors, motor imbalance,
  //  position tracking error) are often impact-cascade noise that fires AFTER the actual problem.
  // When a non-effect critical finding exists, mark effect-category findings as cascade so they
  // drop out of Primary Issues. Findings with timestamps are kept if they occurred BEFORE the root
  // event (i.e. chronic vibration that started early in flight is the real cause, not noise).
  {
    const causes=r.findings.filter(f=>f.sev==='crit'&&f.cat!=='effect');
    const causeTimes=causes.map(f=>f.t).filter(t=>t!=null);
    const rootEventT=causeTimes.length?Math.min(...causeTimes):null;
    if(causes.length){
      for(const f of r.findings){
        if(f.cat!=='effect')continue;
        if(f.t!=null&&rootEventT!=null){
          // Has timestamp — only demote if it occurred AFTER the root event
          if(f.t>rootEventT+1.0)f._cascade=true;
        }else{
          // No timestamp (whole-flight peak) — demote since we have a clear in-flight cause
          f._cascade=true;
        }
      }
    }
  }

  // ── PRIMARY CAUSE / VERDICT — pick the most explanatory single root cause ──
  const _findCrit=pat=>r.findings.find(f=>f.sev==='crit'&&!f._cascade&&pat.test(f.text));
  let _verdict=null;
  if(_findCrit(/crash detected|^<strong>crash/i))
    _verdict='Autopilot detected a crash — flight ended unexpectedly. Look at the events around the crash time for the trigger.';
  else if(_findCrit(/parachute/i))
    _verdict='Parachute deployed — emergency descent triggered.';
  else if(_findCrit(/RC failsafe|throttle failsafe/i))
    _verdict='RC link lost — receiver stopped seeing the transmitter, autopilot fell back to its failsafe behavior.';
  else if(_findCrit(/possible battery ejection|sudden power loss/i))
    _verdict='Sudden power loss — log ended abruptly with battery still healthy. Most likely battery ejection or power-wiring failure.';
  else if(_findCrit(/sustained yaw spin/i))
    _verdict='Uncontrolled yaw spin — drone rotated visibly out of its commanded heading. Most often a prop strike, motor failure, or collision with a neighbor.';
  else if(_findCrit(/EKF variance critical/i))
    _verdict='EKF (sensor fusion) lost confidence in its sensors — autopilot would have triggered an RTL or Land. Look for vibration, GPS, or compass issues in the same window.';
  else if(_findCrit(/lost fix entirely|GPS lost/i))
    _verdict='GPS lost fix — drone was flying on dead-reckoning, so its commanded show position was meaningless during that window.';
  else if(_findCrit(/RTK Fixed only|RTK degraded continuously/i))
    _verdict='Severe RTK degradation — drone could not hold pixel-precise position for a meaningful portion of the show.';
  else if(_findCrit(/motor saturation/i))
    _verdict='Motor saturation — lift motors were pinned at max output for an extended period. Either overweight, climbing too fast, or losing thrust authority.';
  else if(_findCrit(/critical battery voltage/i))
    _verdict='Battery hit critical voltage mid-flight.';
  else if(_findCrit(/critical vibration/i))
    _verdict='Severe vibration — likely degraded the EKF position estimate and could have caused a hard landing or position drift.';
  else if(_findCrit(/geofence/i))
    _verdict='Geofence breach — autopilot enforced the boundary and intervened.';
  else if(_findCrit(/system error/i))
    _verdict='Autopilot raised a critical subsystem error — see the Primary Issues list for which subsystem.';

  if(_verdict)
    r.findings.unshift({sev:'crit',icon:'🎯',text:`<strong>Likely cause:</strong> ${_verdict}`,_verdict:true});
  else if(r.findings.filter(f=>f.sev==='crit').length===0&&r.findings.filter(f=>f.sev==='warn').length===0)
    r.findings.unshift({sev:'ok',icon:'✅',text:`<strong>Flight nominal</strong> — no critical issues detected, no notable warnings raised.`,_verdict:true});

  // ── OVERALL ──
  const nC=r.findings.filter(f=>f.sev==='crit'&&!f._verdict&&!f._cascade).length,nW=r.findings.filter(f=>f.sev==='warn').length;
  r.cards.unshift({label:'Overall',val:nC?`${nC} Critical`:nW?`${nW} Warning${nW>1?'s':''}`:'Good',
    desc:nC?`+${nW} warnings`:nW?'No critical issues':'All checks passed',
    status:nC?'crit':nW?'warn':'ok',
    tip:`Summary of all detected issues: ${nC} critical, ${nW} warnings across battery, GPS, attitude, and system health checks.`});

  r.cards=r.cards.filter((c,i,a)=>a.findIndex(x=>x.label===c.label)===i);

  return r;
}

// ═══════════════════════════════════════
//  CHART RENDERER (SVG + crosshair)
// ═══════════════════════════════════════
function fmtT(s){return s<60?`${Math.round(s)}s`:`${Math.floor(s/60)}m${String(Math.floor(s%60)).padStart(2,'0')}s`;}

// Global time window [0..1] normalized
let TR={s:0,e:1};
function applyTR(data,dur){
  if(!data||!data.length)return data;
  if(dur<=0)return data;
  const t0=TR.s*dur,t1=TR.e*dur;
  return data.filter(d=>d.x>=t0&&d.x<=t1);
}

function lineChart(el,d1,opts={},d2=null,d2c='#3b82f6',dur=0){
  el.innerHTML='';
  const fd1=applyTR(d1,dur),fd2=d2?applyTR(d2,dur):null;
  if((!fd1||!fd1.length)&&(!fd2||!fd2.length)){el.innerHTML='<div class="no-data">No data in range</div>';return;}
  const{color='#FA9C21',thresholds=[],yMin:ym0,yMax:ym1,yFmt=v=>v.toFixed(1),label=''}=opts;
  const all=[...(fd1||[]),...(fd2||[])];
  const W=el.getBoundingClientRect().width||520,H=150;
  const p={t:10,r:14,b:28,l:44};
  const cW=W-p.l-p.r,cH=H-p.t-p.b;
  const xs=all.map(d=>d.x),ys=all.map(d=>d.y);
  const x0=Math.min(...xs),x1=Math.max(...xs);
  let y0=ym0!=null?ym0:Math.min(...ys),y1=ym1!=null?ym1:Math.max(...ys);
  const yp=(y1-y0)*.08||.2;
  if(ym0==null)y0-=yp;if(ym1==null)y1+=yp;
  const sx=x=>p.l+(x1===x0?.5:(x-x0)/(x1-x0))*cW;
  const sy=y=>p.t+(1-(y1===y0?.5:(y-y0)/(y1-y0)))*cH;
  const gid='g'+Math.random().toString(36).slice(2,8);

  function mkPath(dat,col){
    if(!dat||!dat.length)return'';
    const pd=dat.map((d,i)=>`${i?'L':'M'}${sx(d.x).toFixed(1)},${sy(d.y).toFixed(1)}`).join(' ');
    const ad=pd+` L${sx(dat[dat.length-1].x).toFixed(1)},${(p.t+cH).toFixed(1)} L${sx(dat[0].x).toFixed(1)},${(p.t+cH).toFixed(1)}Z`;
    const gi=gid+col.replace('#','');
    return`<defs><linearGradient id="${gi}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${col}" stop-opacity=".18"/><stop offset="100%" stop-color="${col}" stop-opacity=".01"/></linearGradient></defs>
    <path d="${ad}" fill="url(#${gi})" clip-path="url(#clip${gid})"/>
    <path d="${pd}" stroke="${col}" stroke-width="1.5" fill="none" clip-path="url(#clip${gid})"/>`;
  }

  let svg=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
  <defs><clipPath id="clip${gid}"><rect x="${p.l}" y="${p.t}" width="${cW}" height="${cH}"/></clipPath></defs>`;
  for(let i=0;i<=4;i++){const y=p.t+(i/4)*cH,val=y1-(i/4)*(y1-y0);
    svg+=`<line x1="${p.l}" y1="${y.toFixed(1)}" x2="${p.l+cW}" y2="${y.toFixed(1)}" stroke="#191919" stroke-width="1"/>
    <text x="${p.l-5}" y="${y.toFixed(1)}" text-anchor="end" dominant-baseline="middle" fill="#777" font-size="9.5" font-family="-apple-system,sans-serif">${yFmt(val)}</text>`;}
  for(let i=0;i<=5;i++){const x=p.l+(i/5)*cW,val=x0+(i/5)*(x1-x0);
    svg+=`<text x="${x.toFixed(1)}" y="${H-4}" text-anchor="middle" fill="#666" font-size="9.5" font-family="-apple-system,sans-serif">${fmtT(val)}</text>`;}
  for(const th of thresholds){const ty=sy(th.value);if(ty>=p.t&&ty<=p.t+cH)
    svg+=`<line x1="${p.l}" y1="${ty.toFixed(1)}" x2="${p.l+cW}" y2="${ty.toFixed(1)}" stroke="${th.color||'#ef4444'}" stroke-width="1" stroke-dasharray="4,3" opacity="0.55"/>`;}
  svg+=mkPath(fd1,color);if(fd2&&fd2.length)svg+=mkPath(fd2,d2c);
  svg+=`<line x1="${p.l}" y1="${p.t}" x2="${p.l}" y2="${p.t+cH}" stroke="#252525" stroke-width="1"/>
  <line x1="${p.l}" y1="${p.t+cH}" x2="${p.l+cW}" y2="${p.t+cH}" stroke="#252525" stroke-width="1"/>`;
  svg+='</svg>';
  el.innerHTML=svg;

  // Crosshair overlay
  const xh=document.createElement('div');xh.className='xhair';el.appendChild(xh);
  const tip=document.createElement('div');tip.className='ctip';el.appendChild(tip);
  const cover=document.createElement('div');cover.className='cover';el.appendChild(cover);
  const srcData=fd1&&fd1.length?fd1:(fd2||[]);
  cover.addEventListener('mousemove',e=>{
    const rect=el.getBoundingClientRect();
    const mx=e.clientX-rect.left;
    const chartX=mx-p.l;
    if(chartX<0||chartX>cW){xh.style.display='none';tip.style.display='none';return;}
    const t=x0+(chartX/cW)*(x1-x0);
    const near=srcData.reduce((b,d)=>Math.abs(d.x-t)<Math.abs(b.x-t)?d:b,srcData[0]);
    xh.style.display='block';xh.style.left=mx+'px';
    const tipX=mx>W/2?mx-130:mx+10;
    const tipY=Math.max(10,e.clientY-rect.top-35);
    tip.style.cssText=`display:block;left:${tipX}px;top:${tipY}px;`;
    tip.innerHTML=`<span style="color:var(--accent);font-size:9.5px">T+${fmtT(near.x)}</span><br>${yFmt(near.y)}${label?' '+label:''}`;
    if(fd2&&fd2.length){const n2=fd2.reduce((b,d)=>Math.abs(d.x-t)<Math.abs(b.x-t)?d:b,fd2[0]);
      tip.innerHTML+=`<br><span style="color:#3b82f6">${yFmt(n2.y)}</span>`;}
  });
  cover.addEventListener('mouseleave',()=>{xh.style.display='none';tip.style.display='none';});
}

function stepChart(el,d1,d2=null,dur=0){
  el.innerHTML='';
  const fd1=applyTR(d1,dur),fd2=d2?applyTR(d2,dur):null;
  if((!fd1||!fd1.length)&&(!fd2||!fd2.length)){el.innerHTML='<div class="no-data">No data</div>';return;}
  const W=el.getBoundingClientRect().width||520,H=150;
  const p={t:10,r:14,b:28,l:72};
  const cW=W-p.l-p.r,cH=H-p.t-p.b;
  const all=[...(fd1||[]),...(fd2||[])];
  const x0=Math.min(...all.map(d=>d.x)),x1=Math.max(...all.map(d=>d.x));
  const sx=x=>p.l+(x1===x0?.5:(x-x0)/(x1-x0))*cW;
  const sy=y=>p.t+(1-y/6)*cH;
  const GC={0:'#ef4444',1:'#ef4444',2:'#f97316',3:'#eab308',4:'#84cc16',5:'#22c55e',6:'#FA9C21'};
  const GL={0:'No GPS',1:'No Fix',2:'2D Fix',3:'3D Fix',4:'DGPS',5:'RTK Float',6:'RTK Fixed'};
  function mkStep(pts,col){
    let d='';for(let i=0;i<pts.length;i++){const cx=sx(pts[i].x).toFixed(1),cy=sy(pts[i].y).toFixed(1);
      if(!i)d+=`M${cx},${cy}`;else d+=` L${cx},${sy(pts[i-1].y).toFixed(1)} L${cx},${cy}`;}
    return d?`<path d="${d}" stroke="${col}" stroke-width="2" fill="none" clip-path="url(#cg${gid})"/>`:'';
  }
  const gid=Math.random().toString(36).slice(2,8);
  let svg=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
  <defs><clipPath id="cg${gid}"><rect x="${p.l}" y="${p.t}" width="${cW}" height="${cH}"/></clipPath></defs>`;
  for(const v of[0,2,3,4,5,6]){const ty=sy(v);
    svg+=`<line x1="${p.l}" y1="${ty.toFixed(1)}" x2="${p.l+cW}" y2="${ty.toFixed(1)}" stroke="#191919" stroke-width="1"/>
    <text x="${p.l-5}" y="${ty.toFixed(1)}" text-anchor="end" dominant-baseline="middle" fill="${GC[v]||'#666'}" font-size="9" font-family="-apple-system,sans-serif">${GL[v]||v}</text>`;}
  for(let i=0;i<=5;i++){const x=p.l+(i/5)*cW,val=x0+(i/5)*(x1-x0);
    svg+=`<text x="${x.toFixed(1)}" y="${H-4}" text-anchor="middle" fill="#666" font-size="9.5" font-family="-apple-system,sans-serif">${fmtT(val)}</text>`;}
  if(fd1&&fd1.length)svg+=mkStep(fd1,'#FA9C21');
  if(fd2&&fd2.length)svg+=mkStep(fd2,'#3b82f6');
  svg+=`<line x1="${p.l}" y1="${p.t}" x2="${p.l}" y2="${p.t+cH}" stroke="#252525" stroke-width="1"/>
  <line x1="${p.l}" y1="${p.t+cH}" x2="${p.l+cW}" y2="${p.t+cH}" stroke="#252525" stroke-width="1"/>`;
  svg+='</svg>';
  el.innerHTML=svg;

  const xh=document.createElement('div');xh.className='xhair';el.appendChild(xh);
  const tip=document.createElement('div');tip.className='ctip';el.appendChild(tip);
  const cover=document.createElement('div');cover.className='cover';el.appendChild(cover);
  const srcD=fd1&&fd1.length?fd1:(fd2||[]);
  cover.addEventListener('mousemove',e=>{
    const rect=el.getBoundingClientRect(),mx=e.clientX-rect.left,cx=mx-p.l;
    if(cx<0||cx>cW){xh.style.display='none';tip.style.display='none';return;}
    const t=x0+(cx/cW)*(x1-x0);
    const near=srcD.reduce((b,d)=>Math.abs(d.x-t)<Math.abs(b.x-t)?d:b,srcD[0]);
    xh.style.display='block';xh.style.left=mx+'px';
    const tipX=mx>W/2?mx-140:mx+10,tipY=Math.max(10,e.clientY-rect.top-35);
    tip.style.cssText=`display:block;left:${tipX}px;top:${tipY}px;`;
    tip.innerHTML=`<span style="color:var(--accent);font-size:9.5px">T+${fmtT(near.x)}</span><br>${GL[near.y]||near.y}`;
  });
  cover.addEventListener('mouseleave',()=>{xh.style.display='none';tip.style.display='none';});
}
